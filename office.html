<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Club Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .prose { max-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="app-root">
        <!-- App content will be rendered here by JavaScript -->
        <div class="flex items-center justify-center h-screen">
            <div class="text-xl font-semibold">Initializing...</div>
        </div>
    </div>

    <!-- Modal (used for email previews) -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-full overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 id="modal-title" class="text-xl font-semibold"></h3>
                <button id="modal-close-btn" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 prose"></div>
        </div>
    </div>

    <script type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
            query, where, writeBatch, Timestamp, getDoc, getDocs, serverTimestamp, increment
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- IMPORTANT: Configuration ---
        const ADMIN_EMAIL = "pavlospanos@hotmail.com"; // The Coffee Master's email
        const DEFAULT_PASSWORD = "ILoveCoffee"; // Default password for all regular users

        const firebaseConfig = {
          apiKey: "AIzaSyBqThTqWZxNg1nyXpDRNBSM-wPNpDEGodA",
          authDomain: "officecoffeemanager.firebaseapp.com",
          projectId: "officecoffeemanager",
          storageBucket: "officecoffeemanager.firebasestorage.app",
          messagingSenderId: "850510501748",
          appId: "1:850510501748:web:79816a904ad8c66d893e21",
          measurementId: "G-RKM8LJWP2P"
        };
        
        // --- App State ---
        let db, auth;
        let currentUser = null;
        let isAdmin = false;
        let appState = {
            members: [],
            inventory: { officeStockKg: 0, warehouseStockKg: 0 },
            inventoryHistory: [],
            paymentRounds: [],
            activeRound: null,
            activeRoundPayments: [],
            activeTab: 'dashboard',
            userProfile: null,
        };
        
        const appId = firebaseConfig.projectId || 'coffee-club-default';

        // --- DOM Elements ---
        const appRoot = document.getElementById('app-root');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- Helper Functions ---
        const getCollectionPath = (collectionName) => `artifacts/${appId}/public/data/${collectionName}`;
        const showModal = (title, contentHTML) => {
            modalTitle.textContent = title;
            modalContent.innerHTML = contentHTML;
            modal.classList.remove('hidden');
        };
        const closeModal = () => modal.classList.add('hidden');
        const showError = (elementId, message) => {
            const errorEl = document.getElementById(elementId);
            if(errorEl) {
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }
        };

        // --- Core Render Function ---
        const renderApp = () => {
            if (!currentUser) {
                renderLoginScreen();
            } else {
                isAdmin = currentUser.email === ADMIN_EMAIL;
                renderMainLayout();
            }
        };

        // --- Login & Public View ---
        const renderLoginScreen = () => {
            const docRef = doc(db, getCollectionPath('inventory'), 'main');
            getDoc(docRef).then(docSnap => {
                const publicInventory = docSnap.exists() ? docSnap.data() : { officeStockKg: 0, warehouseStockKg: 0 };
                const totalStock = (publicInventory.officeStockKg || 0) + (publicInventory.warehouseStockKg || 0);
                appRoot.innerHTML = `
                    <div class="min-h-screen bg-gray-100 flex flex-col justify-center items-center p-4">
                        <div class="w-full max-w-md">
                            <div class="bg-white p-8 rounded-2xl shadow-lg text-center mb-8">
                                <h2 class="text-2xl font-bold text-gray-800 mb-2">Public Dashboard</h2>
                                <p class="text-gray-500 mb-4">Current Office Coffee Status</p>
                                <div class="grid grid-cols-2 gap-4 text-left">
                                    <div class="bg-amber-50 p-4 rounded-lg"><p class="text-sm text-amber-800">Office Stock</p><p class="text-xl font-bold text-amber-900">${publicInventory.officeStockKg.toFixed(2)} kg</p></div>
                                    <div class="bg-blue-50 p-4 rounded-lg"><p class="text-sm text-blue-800">Total Stock</p><p class="text-xl font-bold text-blue-900">${totalStock.toFixed(2)} kg</p></div>
                                </div>
                            </div>
                            <div class="bg-white p-8 rounded-2xl shadow-lg">
                                <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Coffee Club Login</h2>
                                <form id="login-form">
                                    <div class="mb-4"><label for="email" class="block text-sm font-medium text-gray-700">Email Address</label><input type="email" name="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"></div>
                                    <div class="mb-6"><label for="password" class="block text-sm font-medium text-gray-700">Password</label><input type="password" name="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"></div>
                                    <button type="submit" class="w-full bg-amber-500 text-white font-bold py-2 px-4 rounded-md hover:bg-amber-600 transition-colors">Login</button>
                                    <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden"></p>
                                    <p class="text-xs text-gray-500 mt-4 text-center">Regular members: Use your email and the default password 'ILoveCoffee'.</p>
                                </form>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('login-form').addEventListener('submit', handleLogin);
            }).catch(err => {
                 appRoot.innerHTML = `<div class="text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg"><h2>Error</h2><p>Could not load public data. Check console for details.</p></div>`;
                 console.error("Error fetching public data:", err);
            });
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            const { email, password } = e.target.elements;
            try {
                await signInWithEmailAndPassword(auth, email.value, password.value);
            } catch (error) {
                if ((error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') && password.value === DEFAULT_PASSWORD) {
                    try {
                        const userQuery = query(collection(db, getCollectionPath('users')), where("email", "==", email.value.toLowerCase()));
                        const querySnapshot = await getDocs(userQuery);
                        if (querySnapshot.empty) {
                            showError('login-error', 'This email is not registered. Please contact the Coffee Master.');
                            return;
                        }
                        await createUserWithEmailAndPassword(auth, email.value, password.value);
                    } catch (createError) {
                        showError('login-error', `Registration failed: ${createError.message}`);
                    }
                } else if (error.code === 'auth/wrong-password'){
                     showError('login-error', 'Incorrect password. Remember, the default password is "ILoveCoffee".');
                } else {
                    showError('login-error', `Login failed: ${error.message}`);
                }
            }
        };

        const handleLogout = () => signOut(auth);

        // --- Main App Layout & Navigation ---
        const renderMainLayout = () => {
            const navItems = isAdmin 
                ? ['dashboard', 'members', 'inventory', 'payments', 'communications']
                : ['dashboard', 'members'];

            appRoot.innerHTML = `
                <div id="app-container" class="flex flex-col md:flex-row">
                    <aside class="bg-gray-800 text-white w-full md:w-64 p-4 md:min-h-screen flex flex-col">
                        <div class="flex items-center mb-8"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 mr-3 text-amber-400"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg><h1 class="text-xl font-bold">Coffee Master</h1></div>
                        <nav id="nav-menu" class="flex flex-row md:flex-col justify-around md:justify-start"></nav>
                        <div class="mt-auto">
                            <div id="app-info" class="pt-8 text-xs text-gray-400 hidden md:block"><p class="truncate">User: ${currentUser.email}</p>${isAdmin ? '<p class="text-amber-400 font-bold">Admin Access</p>' : ''}</div>
                            <button id="logout-btn" class="w-full mt-4 bg-red-500 text-white font-bold py-2 px-4 rounded-md hover:bg-red-600 transition-colors">Logout</button>
                        </div>
                    </aside>
                    <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8"></main>
                </div>`;
            
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            document.getElementById('nav-menu').addEventListener('click', (e) => {
                const button = e.target.closest('.nav-button');
                if (button) {
                    appState.activeTab = button.dataset.tab;
                    renderCurrentView(); // FIX: Just re-render the content, not the whole layout
                }
            });
            renderCurrentView(); // Initial render
        };
        
        const renderCurrentView = () => {
            const mainContent = document.getElementById('main-content');
            const navMenu = document.getElementById('nav-menu');
            if (!mainContent || !navMenu) return;

            // FIX: Update nav button styles without re-rendering the whole sidebar
            const navIcons = {
                dashboard: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
                members: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
                inventory: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>`,
                payments: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`,
                communications: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="m22 2-7 20-4-9-9-4Z"/><path d="m22 2-11 11"/></svg>`
            };
            const navItems = isAdmin 
                ? ['dashboard', 'members', 'inventory', 'payments', 'communications']
                : ['dashboard', 'members'];
            navMenu.innerHTML = navItems.map(tab => `
                <button data-tab="${tab}" class="nav-button flex items-center w-full text-left p-3 my-1 rounded-lg transition-colors duration-200 ${appState.activeTab === tab ? 'bg-amber-500 text-gray-900' : 'hover:bg-gray-700'}">${navIcons[tab]}<span class="capitalize hidden md:inline">${tab}</span></button>
            `).join('');

            switch (appState.activeTab) {
                case 'dashboard': mainContent.innerHTML = isAdmin ? renderAdminDashboard() : renderUserDashboard(); break;
                case 'members': mainContent.innerHTML = renderMembers(); attachMemberEventListeners(); break;
                case 'inventory': mainContent.innerHTML = renderInventory(); attachInventoryEventListeners(); break;
                case 'payments': mainContent.innerHTML = renderPayments(); attachPaymentsEventListeners(); break;
                case 'communications': mainContent.innerHTML = renderCommunications(); attachCommunicationsEventListeners(); break;
                default: mainContent.innerHTML = isAdmin ? renderAdminDashboard() : renderUserDashboard();
            }
        };

        // --- View-Specific Render Functions ---
        const renderAdminDashboard = () => {
            const totalStock = (appState.inventory.officeStockKg || 0) + (appState.inventory.warehouseStockKg || 0);
            return `<h2 class="text-3xl font-bold mb-6">Admin Dashboard</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"><div class="bg-white p-6 rounded-lg shadow-md">Total Members: <span class="font-bold text-2xl">${appState.members.length}</span></div><div class="bg-white p-6 rounded-lg shadow-md">Total Stock: <span class="font-bold text-2xl">${totalStock.toFixed(2)} kg</span></div><div class="bg-white p-6 rounded-lg shadow-md">Active Round: <span class="font-bold text-xl">${appState.activeRound ? appState.activeRound.name : 'None'}</span></div></div>`;
        };

        const renderUserDashboard = () => {
            return `<h2 class="text-3xl font-bold mb-6">Welcome, ${appState.userProfile ? appState.userProfile.name : currentUser.email}!</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-white p-6 rounded-lg shadow-md"><p class="text-sm text-gray-500">Your Total Contribution</p><p class="text-3xl font-bold text-green-600">$${(appState.userProfile?.totalContributed || 0).toFixed(2)}</p></div><div class="bg-white p-6 rounded-lg shadow-md"><p class="text-sm text-gray-500">Current Coffee Stock (Office)</p><p class="text-3xl font-bold text-amber-800">${(appState.inventory.officeStockKg || 0).toFixed(2)} kg</p></div></div>`;
        };

        const renderMembers = () => {
            const memberListHTML = appState.members.map(member => {
                const isSelf = member.email === currentUser.email;
                return `
                    <tr class="border-b hover:bg-gray-50 ${isSelf ? 'bg-amber-50 font-bold' : ''}">
                        <td class="p-2">${member.name}</td>
                        <td class="p-2 text-gray-600">${isSelf || isAdmin ? member.email : '******'}</td>
                        <td class="p-2 text-gray-600 hidden md:table-cell">${isSelf || isAdmin ? member.phone : '******'}</td>
                        <td class="p-2 text-right">${isSelf || isAdmin ? '$' + (member.totalContributed || 0).toFixed(2) : '******'}</td>
                        ${isAdmin ? `<td class="p-2 text-center"><button data-id="${member.id}" class="delete-member-btn text-red-500 hover:text-red-700 p-1"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button></td>` : ''}
                    </tr>`;
            }).join('');

            const addMemberFormHTML = isAdmin ? `
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-xl font-semibold mb-4">Add New Member</h3>
                    <form id="add-member-form" class="space-y-4">
                        <input name="name" type="text" placeholder="Full Name" required class="w-full p-2 border rounded-md" />
                        <input name="email" type="email" placeholder="Email Address" required class="w-full p-2 border rounded-md" />
                        <input name="phone" type="tel" placeholder="Phone Number (Optional)" class="w-full p-2 border rounded-md" />
                        <button type="submit" class="w-full bg-amber-500 text-white font-bold py-2 px-4 rounded-md hover:bg-amber-600 transition-colors">Add Member</button>
                    </form>
                </div>` : '';

            return `
                <h2 class="text-3xl font-bold mb-6">Club Members</h2>
                <div class="grid grid-cols-1 ${isAdmin ? 'lg:grid-cols-3' : ''} gap-8">
                    <div class="${isAdmin ? 'lg:col-span-2' : 'col-span-full'} bg-white p-6 rounded-lg shadow-md">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead><tr class="border-b"><th class="p-2">Name</th><th class="p-2">Email</th><th class="p-2 hidden md:table-cell">Phone</th><th class="p-2 text-right">Total Contributed</th>${isAdmin ? '<th class="p-2 text-center">Actions</th>' : ''}</tr></thead>
                                <tbody>${memberListHTML}</tbody>
                            </table>
                        </div>
                    </div>
                    ${addMemberFormHTML}
                </div>`;
        };

        const renderInventory = () => {
            return `
                <h2 class="text-3xl font-bold mb-6">Inventory Management</h2>
                 <div class="mb-6 grid grid-cols-1 md:grid-cols-2 gap-6 text-center">
                    <div class="bg-white p-4 rounded-lg shadow-md">
                        <p class="text-sm text-gray-500">Office Stock</p>
                        <p class="text-2xl font-bold">${(appState.inventory.officeStockKg || 0).toFixed(2)} kg</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow-md">
                        <p class="text-sm text-gray-500">Warehouse Stock</p>
                        <p class="text-2xl font-bold">${(appState.inventory.warehouseStockKg || 0).toFixed(2)} kg</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h3 class="text-xl font-semibold mb-4 text-green-700">Add Purchased Coffee</h3>
                            <form id="add-stock-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Amount Purchased (kg)</label>
                                    <input name="amount" type="number" step="0.1" placeholder="e.g., 1.0" required class="w-full p-2 border rounded-md mt-1" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Add to</label>
                                    <select name="location" class="w-full p-2 border rounded-md mt-1">
                                        <option value="office">Office</option>
                                        <option value="warehouse">Warehouse</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded-md hover:bg-green-600 transition-colors">Add Stock</button>
                            </form>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h3 class="text-xl font-semibold mb-4 text-red-700">Log Consumed Coffee</h3>
                            <form id="log-consumption-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Amount Consumed (kg)</label>
                                    <input name="consumption" type="number" step="0.1" placeholder="e.g., 0.5" required class="w-full p-2 border rounded-md mt-1" />
                                </div>
                                <p class="text-xs text-gray-500">This will be subtracted from the Office stock.</p>
                                <button type="submit" class="w-full bg-red-500 text-white font-bold py-2 px-4 rounded-md hover:bg-red-600 transition-colors">Log Consumption</button>
                            </form>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h3 class="text-xl font-semibold mb-4">History</h3>
                        <ul class="space-y-3 max-h-96 overflow-y-auto pr-2">
                            ${appState.inventoryHistory.map(log => `
                                <li class="flex justify-between items-center text-sm border-b pb-2">
                                    <div>
                                        <span class="font-semibold ${log.type === 'purchase' ? 'text-green-600' : 'text-red-600'}">${log.type.charAt(0).toUpperCase() + log.type.slice(1)}</span>
                                        <span class="text-gray-500 text-xs block">${log.date ? new Date(log.date.toDate()).toLocaleString() : '...'}</span>
                                    </div>
                                    <div class="text-right">
                                        <span class="font-semibold">${log.amountKg.toFixed(2)} kg ${log.location ? `(${log.location})` : ''}</span>
                                        ${isAdmin ? `<button data-id="${log.id}" class="delete-tx-btn text-gray-400 hover:text-red-600 ml-2 p-1 text-xs">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                        </button>` : ''}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
        };
        
        const renderPayments = () => { return `<!-- Payments View HTML -->`; };
        const renderCommunications = () => { return `<!-- Communications View HTML -->`; };

        // --- Event Listener Attachment ---
        const attachMemberEventListeners = () => {
            document.getElementById('add-member-form')?.addEventListener('submit', handleAddMember);
            document.querySelectorAll('.delete-member-btn').forEach(btn => btn.addEventListener('click', (e) => handleDeleteMember(e.currentTarget.dataset.id)));
        };
        const attachInventoryEventListeners = () => {
            document.getElementById('add-stock-form')?.addEventListener('submit', handleAddStock);
            document.getElementById('log-consumption-form')?.addEventListener('submit', handleLogConsumption);
            document.querySelectorAll('.delete-tx-btn').forEach(btn => btn.addEventListener('click', (e) => handleDeleteTransaction(e.currentTarget.dataset.id)));
        };
        const attachPaymentsEventListeners = () => { /* ... */ };
        const attachCommunicationsEventListeners = () => { /* ... */ };

        // --- Data Handlers (CRUD) ---
        const handleAddMember = async (e) => {
            e.preventDefault();
            const form = e.target;
            const { name, email, phone } = form.elements;
            if (!name.value || !email.value || !db) return;
            try {
                const userQuery = query(collection(db, getCollectionPath('users')), where("email", "==", email.value.toLowerCase()));
                const querySnapshot = await getDocs(userQuery);
                if (!querySnapshot.empty) {
                    alert("A member with this email already exists.");
                    return;
                }
                await addDoc(collection(db, getCollectionPath('users')), {
                    name: name.value, email: email.value.toLowerCase(), phone: phone.value,
                    totalContributed: 0, joinedDate: Timestamp.now()
                });
                form.reset();
            } catch (error) { console.error("Error adding member:", error); }
        };

        const handleDeleteMember = async (memberId) => {
            if (!isAdmin) return;
            try {
                await deleteDoc(doc(db, getCollectionPath('users'), memberId));
            } catch (error) { console.error("Error deleting member:", error); }
        };
        const handleDeleteTransaction = async (txId) => {
            if (!isAdmin) return;
            
            const txDocRef = doc(db, getCollectionPath('inventoryHistory'), txId);
            try {
                const txDoc = await getDoc(txDocRef);
                if (!txDoc.exists()) {
                    console.error("Transaction not found");
                    return;
                }
                const txData = txDoc.data();
                const amountToReverse = txData.type === 'purchase' ? -txData.amountKg : txData.amountKg;
                const locationToUpdate = txData.location === 'office' ? 'officeStockKg' : 'warehouseStockKg';

                const inventoryRef = doc(db, getCollectionPath('inventory'), 'main');

                const batch = writeBatch(db);
                batch.delete(txDocRef);
                batch.update(inventoryRef, { [locationToUpdate]: increment(amountToReverse) });
                await batch.commit();

            } catch (error) {
                console.error("Error deleting transaction:", error);
                alert("Error deleting transaction. Check console for details.");
            }
        };
        
        const handleAddStock = async (e) => {
            e.preventDefault();
            const form = e.target;
            const amountKg = parseFloat(form.elements.amount.value);
            const location = form.elements.location.value;
            if (!db || amountKg <= 0) return;
            
            const inventoryRef = doc(db, getCollectionPath('inventory'), 'main');
            const historyRef = collection(db, getCollectionPath('inventoryHistory'));

            try {
                const batch = writeBatch(db);
                const updateData = {};
                if (location === 'office') {
                    updateData.officeStockKg = increment(amountKg);
                } else {
                    updateData.warehouseStockKg = increment(amountKg);
                }
                batch.update(inventoryRef, updateData);
                batch.set(doc(historyRef), {
                    type: 'purchase',
                    amountKg: amountKg,
                    location: location,
                    date: serverTimestamp()
                });
                await batch.commit();
                form.reset();
            } catch (error) {
                console.error("Error adding stock:", error);
            }
        };
        const handleLogConsumption = async (e) => {
             e.preventDefault();
            const form = e.target;
            const amountKg = parseFloat(form.elements.consumption.value);
            if (!db || amountKg <= 0) return;

            if (amountKg > appState.inventory.officeStockKg) {
                alert("Cannot consume more coffee than is available in the office!");
                return;
            }

            const inventoryRef = doc(db, getCollectionPath('inventory'), 'main');
            const historyRef = collection(db, getCollectionPath('inventoryHistory'));
            
            try {
                const batch = writeBatch(db);
                batch.update(inventoryRef, { officeStockKg: increment(-amountKg) });
                batch.set(doc(historyRef), {
                    type: 'consumption',
                    amountKg: amountKg,
                    location: 'office',
                    date: serverTimestamp()
                });
                await batch.commit();
                form.reset();
            } catch (error) { console.error("Error logging consumption:", error); }
        };

        // --- Initialization ---
        let listeners = [];
        const detachListeners = () => {
            listeners.forEach(unsubscribe => unsubscribe());
            listeners = [];
        };

        const setupListeners = () => {
            detachListeners();
            
            const membersQuery = query(collection(db, getCollectionPath('users')));
            listeners.push(onSnapshot(membersQuery, s => {
                appState.members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!isAdmin) {
                    const self = appState.members.find(m => m.email === currentUser.email);
                    if (self) appState.userProfile = self;
                }
                renderCurrentView();
            }));
            
            listeners.push(onSnapshot(doc(db, getCollectionPath('inventory'), 'main'), s => {
                appState.inventory = s.exists() ? s.data() : {};
                renderCurrentView();
            }));

            if (isAdmin) {
                listeners.push(onSnapshot(query(collection(db, getCollectionPath('inventoryHistory'))), s => { 
                    appState.inventoryHistory = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.inventoryHistory.sort((a, b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
                    renderCurrentView(); 
                }));
            }
        };

        const init = () => {
            try {
                if (!firebaseConfig.apiKey) {
                    appRoot.innerHTML = `<div class="text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg"><h2>Configuration Needed!</h2><p>Please edit this HTML file and fill in your Firebase project configuration.</p></div>`;
                    return;
                }
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                onAuthStateChanged(auth, user => {
                    detachListeners();
                    currentUser = user;
                    if(user) {
                        setupListeners();
                    } else {
                        renderApp();
                    }
                });

                modalCloseBtn.addEventListener('click', closeModal);

            } catch (error) {
                console.error("Critical initialization error:", error);
                appRoot.innerHTML = `<div class="text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg"><h2>Initialization Error</h2><p>${error.message}</p></div>`;
            }
        };

        // --- Start the App ---
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
