<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Club Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .prose { max-width: none; }
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="app-root">
        <!-- App content will be rendered here by JavaScript -->
        <div class="flex items-center justify-center h-screen">
            <div class="text-xl font-semibold">Initializing...</div>
        </div>
    </div>

    <!-- Modal (used for email previews and suggestions) -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-full overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 id="modal-title" class="text-xl font-semibold"></h3>
                <button id="modal-close-btn" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 prose"></div>
        </div>
    </div>

    <script type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
            query, where, writeBatch, Timestamp, getDoc, getDocs, serverTimestamp, increment
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- IMPORTANT: Configuration ---
        const ADMIN_EMAIL = "pavlospanos@hotmail.com"; // The Coffee Master's email
        const DEFAULT_PASSWORD = "ILoveCoffee"; // Default password for all regular users
        const GRAMS_PER_CUP = 10; // Assumption for cost per cup calculation

        const firebaseConfig = {
          apiKey: "AIzaSyBqThTqWZxNg1nyXpDRNBSM-wPNpDEGodA",
          authDomain: "officecoffeemanager.firebaseapp.com",
          projectId: "officecoffeemanager",
          storageBucket: "officecoffeemanager.firebasestorage.app",
          messagingSenderId: "850510501748",
          appId: "1:850510501748:web:79816a904ad8c66d893e21",
          measurementId: "G-RKM8LJWP2P"
        };
        
        // --- App State ---
        let db, auth;
        let currentUser = null;
        let isAdmin = false;
        let appState = {
            members: [],
            coffeeTypes: [],
            financials: { totalCollected: 0, totalSpent: 0 },
            inventoryHistory: [],
            paymentRounds: [],
            activeRound: null,
            activeRoundPayments: [],
            activeTab: 'dashboard',
            userProfile: null,
        };
        
        const appId = firebaseConfig.projectId || 'coffee-club-default';

        // --- DOM Elements ---
        const appRoot = document.getElementById('app-root');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- Helper Functions ---
        const getCollectionPath = (collectionName) => `artifacts/${appId}/public/data/${collectionName}`;
        const showModal = (title, contentHTML) => {
            modalTitle.textContent = title;
            modalContent.innerHTML = contentHTML;
            modal.classList.remove('hidden');
        };
        const closeModal = () => modal.classList.add('hidden');
        const showError = (elementId, message) => {
            const errorEl = document.getElementById(elementId);
            if(errorEl) {
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }
        };

        // --- Core Render Function ---
        const renderApp = () => {
            if (!currentUser) {
                renderLoginScreen();
            } else {
                isAdmin = currentUser.email === ADMIN_EMAIL;
                renderMainLayout();
            }
        };

        // --- Login & Public View ---
        const renderLoginScreen = () => {
            Promise.all([
                getDocs(collection(db, getCollectionPath('coffeeTypes'))),
                getDoc(doc(db, getCollectionPath('financials'), 'summary'))
            ]).then(([coffeeSnapshot, financialSnapshot]) => {
                const publicCoffeeTypes = coffeeSnapshot.docs.map(d => ({id: d.id, ...d.data()})).filter(c => (c.stockKg || 0) > 0);
                const publicFinancials = financialSnapshot.exists() ? financialSnapshot.data() : { totalCollected: 0, totalSpent: 0 };
                
                appRoot.innerHTML = `
                    <div class="min-h-screen bg-gray-100 flex flex-col justify-center items-center p-4">
                        <div class="w-full max-w-4xl">
                            <div class="bg-white p-8 rounded-2xl shadow-lg text-center mb-8">
                                <h2 class="text-3xl font-bold text-gray-800 mb-4">Public Dashboard</h2>
                                ${renderPublicDashboardContent(publicCoffeeTypes, publicFinancials)}
                            </div>
                            <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md mx-auto">
                                <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Coffee Club Login</h2>
                                <form id="login-form">
                                    <div class="mb-4"><label for="email" class="block text-sm font-medium text-gray-700">Email Address</label><input type="email" name="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"></div>
                                    <div class="mb-6"><label for="password" class="block text-sm font-medium text-gray-700">Password</label><input type="password" name="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"></div>
                                    <button type="submit" class="w-full bg-amber-500 text-white font-bold py-2 px-4 rounded-md hover:bg-amber-600 transition-colors">Login</button>
                                    <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden"></p>
                                    <p class="text-xs text-gray-500 mt-4 text-center">Regular members: Use your email and the default password 'ILoveCoffee'.</p>
                                </form>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('login-form').addEventListener('submit', handleLogin);
            }).catch(err => {
                 appRoot.innerHTML = `<div class="text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg"><h2>Error</h2><p>Could not load public data. Please check your Firebase Security Rules.</p></div>`;
                 console.error("Error fetching public data:", err);
            });
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            const { email, password } = e.target.elements;
            try {
                await signInWithEmailAndPassword(auth, email.value, password.value);
            } catch (error) {
                if ((error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') && password.value === DEFAULT_PASSWORD) {
                    try {
                        const userQuery = query(collection(db, getCollectionPath('users')), where("email", "==", email.value.toLowerCase()));
                        const querySnapshot = await getDocs(userQuery);
                        if (querySnapshot.empty) {
                            showError('login-error', 'This email is not registered. Please contact the Coffee Master.');
                            return;
                        }
                        await createUserWithEmailAndPassword(auth, email.value, password.value);
                    } catch (createError) {
                        showError('login-error', `Registration failed: ${createError.message}`);
                    }
                } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential'){
                     showError('login-error', 'Incorrect password. Remember, the default password is "ILoveCoffee".');
                } else {
                    showError('login-error', `Login failed: ${error.message}`);
                }
            }
        };

        const handleLogout = () => signOut(auth);

        // --- Main App Layout & Navigation ---
        const renderMainLayout = () => {
            appRoot.innerHTML = `
                <div id="app-container" class="flex flex-col md:flex-row">
                    <aside class="bg-gray-800 text-white w-full md:w-64 p-4 md:min-h-screen flex flex-col">
                        <div class="flex items-center mb-8"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 mr-3 text-amber-400"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg><h1 class="text-xl font-bold">Coffee Master</h1></div>
                        <nav id="nav-menu" class="flex flex-row md:flex-col justify-around md:justify-start"></nav>
                        <div class="mt-auto">
                            <div id="app-info" class="pt-8 text-xs text-gray-400 hidden md:block"><p class="truncate">User: ${currentUser.email}</p>${isAdmin ? '<p class="text-amber-400 font-bold">Admin Access</p>' : ''}</div>
                            <button id="logout-btn" class="w-full mt-4 bg-red-500 text-white font-bold py-2 px-4 rounded-md hover:bg-red-600 transition-colors">Logout</button>
                        </div>
                    </aside>
                    <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8"></main>
                </div>`;
            
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            document.getElementById('nav-menu').addEventListener('click', (e) => {
                const button = e.target.closest('.nav-button');
                if (button) {
                    appState.activeTab = button.dataset.tab;
                    renderCurrentView();
                }
            });
            renderCurrentView();
        };
        
        const renderCurrentView = () => {
            const mainContent = document.getElementById('main-content');
            const navMenu = document.getElementById('nav-menu');
            if (!mainContent || !navMenu) return;

            const navIcons = {
                dashboard: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
                members: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
                stats: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>`,
                inventory: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>`,
                payments: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`,
                communications: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="m22 2-7 20-4-9-9-4Z"/><path d="m22 2-11 11"/></svg>`
            };
            const navItems = isAdmin 
                ? ['dashboard', 'members', 'stats', 'inventory', 'payments', 'communications']
                : ['dashboard', 'members', 'stats'];
            navMenu.innerHTML = navItems.map(tab => `
                <button data-tab="${tab}" class="nav-button flex items-center w-full text-left p-3 my-1 rounded-lg transition-colors duration-200 ${appState.activeTab === tab ? 'bg-amber-500 text-gray-900' : 'hover:bg-gray-700'}">${navIcons[tab]}<span class="capitalize hidden md:inline">${tab}</span></button>
            `).join('');

            switch (appState.activeTab) {
                case 'dashboard': mainContent.innerHTML = renderDashboard(); break;
                case 'members': mainContent.innerHTML = renderMembers(); attachMemberEventListeners(); break;
                case 'stats': mainContent.innerHTML = renderStats(); attachStatsEventListeners(); break;
                case 'inventory': mainContent.innerHTML = renderInventory(); attachInventoryEventListeners(); break;
                case 'payments': mainContent.innerHTML = renderPayments(); attachPaymentsEventListeners(); break;
                case 'communications': mainContent.innerHTML = renderCommunications(); attachCommunicationsEventListeners(); break;
                default: mainContent.innerHTML = renderDashboard();
            }
        };

        // --- View-Specific Render Functions ---
        const renderPublicDashboardContent = (coffeeTypes, financials) => {
            const remainingBalance = (financials.totalCollected || 0) - (financials.totalSpent || 0);
            return `
                <div class="space-y-6">
                    <div>
                        <h3 class="text-xl font-semibold text-gray-700 mb-3">Financial Overview</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-left">
                            <div class="bg-green-50 p-4 rounded-lg"><p class="text-sm text-green-800">Total Collected</p><p class="text-xl font-bold text-green-900">$${(financials.totalCollected || 0).toFixed(2)}</p></div>
                            <div class="bg-red-50 p-4 rounded-lg"><p class="text-sm text-red-800">Total Spent</p><p class="text-xl font-bold text-red-900">$${(financials.totalSpent || 0).toFixed(2)}</p></div>
                            <div class="bg-blue-50 p-4 rounded-lg"><p class="text-sm text-blue-800">Remaining Balance</p><p class="text-xl font-bold text-blue-900">$${remainingBalance.toFixed(2)}</p></div>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-xl font-semibold text-gray-700 mb-3">Current Coffee Stock</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${coffeeTypes.length > 0 ? coffeeTypes.map(coffee => {
                                const costPerKg = (coffee.totalCostAllTime || 0) / (coffee.totalWeightAllTime || 1);
                                const costPerCup = costPerKg / (1000 / GRAMS_PER_CUP);
                                return `
                                <div class="bg-gray-50 border rounded-lg p-4 text-left flex flex-col">
                                    <img src="${coffee.imageUrl}" onerror="this.onerror=null;this.src='https://placehold.co/400x300/e2e8f0/64748b?text=Coffee';" class="w-full h-32 object-cover rounded-md mb-4">
                                    <h4 class="font-bold text-gray-800">${coffee.name}</h4>
                                    <p class="text-sm text-gray-500 flex-grow">${coffee.brand}</p>
                                    <p class="mt-2 font-semibold text-lg">${(coffee.stockKg || 0).toFixed(2)} kg <span class="text-sm font-normal text-gray-600">remaining</span></p>
                                    <div class="text-xs mt-2 space-y-1 border-t pt-2">
                                        <p><span class="font-semibold">Avg. Cost/kg:</span> $${costPerKg.toFixed(2)}</p>
                                        <p><span class="font-semibold">Cost/cup:</span> $${costPerCup.toFixed(2)} <span class="text-gray-400">(~${GRAMS_PER_CUP}g)</span></p>
                                    </div>
                                </div>
                            `}).join('') : '<p class="text-gray-500 col-span-full">No coffee in stock.</p>'}
                        </div>
                    </div>
                </div>
            `;
        };

        const renderDashboard = () => renderPublicDashboardContent(appState.coffeeTypes, appState.financials);

        const renderMembers = () => {
             const memberListHTML = appState.members.map(member => {
                const isSelf = currentUser && member.email === currentUser.email;
                return `
                    <tr class="border-b hover:bg-gray-50 ${isSelf ? 'bg-amber-50 font-bold' : ''}">
                        <td class="p-2">${member.name}</td>
                        <td class="p-2 text-gray-600">${isSelf || isAdmin ? member.email : '******'}</td>
                        <td class="p-2 text-gray-600 hidden md:table-cell">${isSelf || isAdmin ? member.phone : '******'}</td>
                        <td class="p-2 text-right">${isSelf || isAdmin ? '$' + (member.totalContributed || 0).toFixed(2) : '******'}</td>
                        ${isAdmin ? `<td class="p-2 text-center"><button data-id="${member.id}" class="delete-member-btn text-red-500 hover:text-red-700 p-1"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button></td>` : ''}
                    </tr>`;
            }).join('');

            const addMemberFormHTML = isAdmin ? `
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-xl font-semibold mb-4">Add New Member</h3>
                    <form id="add-member-form" class="space-y-4">
                        <input name="name" type="text" placeholder="Full Name" required class="w-full p-2 border rounded-md" />
                        <input name="email" type="email" placeholder="Email Address" required class="w-full p-2 border rounded-md" />
                        <input name="phone" type="tel" placeholder="Phone Number (Optional)" class="w-full p-2 border rounded-md" />
                        <button type="submit" class="w-full bg-amber-500 text-white font-bold py-2 px-4 rounded-md hover:bg-amber-600 transition-colors">Add Member</button>
                    </form>
                </div>` : '';

            return `
                <h2 class="text-3xl font-bold mb-6">Club Members</h2>
                <div class="grid grid-cols-1 ${isAdmin ? 'lg:grid-cols-3' : ''} gap-8">
                    <div class="${isAdmin ? 'lg:col-span-2' : 'col-span-full'} bg-white p-6 rounded-lg shadow-md">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead><tr class="border-b"><th class="p-2">Name</th><th class="p-2">Email</th><th class="p-2 hidden md:table-cell">Phone</th><th class="p-2 text-right">Total Contributed</th>${isAdmin ? '<th class="p-2 text-center">Actions</th>' : ''}</tr></thead>
                                <tbody>${memberListHTML}</tbody>
                            </table>
                        </div>
                    </div>
                    ${addMemberFormHTML}
                </div>`;
        };
        const renderInventory = () => {
            return `
                <h2 class="text-3xl font-bold mb-6">Inventory Management</h2>
                 <div class="mb-6 grid grid-cols-1 md:grid-cols-2 gap-6 text-center">
                    <div class="bg-white p-4 rounded-lg shadow-md"><p class="text-sm text-gray-500">Total Office Stock</p><p class="text-2xl font-bold">${(appState.coffeeTypes.reduce((sum, coffee) => sum + (coffee.stockKg || 0), 0)).toFixed(2)} kg</p></div>
                    <div class="bg-white p-4 rounded-lg shadow-md"><p class="text-sm text-gray-500">Total Spent on Coffee</p><p class="text-2xl font-bold">$${(appState.financials.totalSpent || 0).toFixed(2)}</p></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 grid grid-cols-1">
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h3 class="text-xl font-semibold mb-4 text-green-700">Add Purchased Coffee</h3>
                            <div id="add-stock-options" class="flex space-x-2 mb-4">
                                <button data-coffee="tchibo_0_5kg" class="flex-1 bg-gray-200 hover:bg-gray-300 p-2 rounded-md text-sm">Tchibo 0.5Kg</button>
                                <button data-coffee="tchibo_1kg" class="flex-1 bg-gray-200 hover:bg-gray-300 p-2 rounded-md text-sm">Tchibo 1Kg</button>
                                <button data-coffee="custom" class="flex-1 bg-gray-200 hover:bg-gray-300 p-2 rounded-md text-sm">Custom</button>
                            </div>
                            <form id="add-stock-form" class="space-y-4 hidden">
                                <input type="hidden" name="imageUrl" />
                                <input type="hidden" name="baseWeightKg" />
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label class="block text-sm font-medium text-gray-700">Coffee Name</label><input name="name" type="text" placeholder="e.g., Caffè Crema Vollmundig" required class="w-full p-2 border rounded-md mt-1" /></div>
                                    <div><label class="block text-sm font-medium text-gray-700">Brand</label><input name="brand" type="text" placeholder="e.g., Tchibo" required class="w-full p-2 border rounded-md mt-1" /></div>
                                    <div id="preset-fields"><label class="block text-sm font-medium text-gray-700">Number of Bags</label><input name="bagNumber" type="number" value="1" min="1" class="w-full p-2 border rounded-md mt-1" /></div>
                                    <div id="custom-fields" class="hidden"><label class="block text-sm font-medium text-gray-700">Bag Weight (kg)</label><input name="weightKg" type="number" step="0.1" placeholder="e.g., 1.0" class="w-full p-2 border rounded-md mt-1" /></div>
                                    <div><label class="block text-sm font-medium text-gray-700">Total Cost ($)</label><input name="totalCost" type="number" step="0.01" placeholder="e.g., 15.50" required class="w-full p-2 border rounded-md mt-1" /></div>
                                </div>
                                <div id="custom-image-url-field" class="hidden"><label class="block text-sm font-medium text-gray-700">Image URL</label><input name="customImageUrl" type="url" placeholder="https://example.com/image.png" class="w-full p-2 border rounded-md mt-1" /></div>
                                <button type="submit" class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded-md hover:bg-green-600 transition-colors mt-2">Add Stock Purchase</button>
                            </form>
                        </div>

        const renderStats = () => {

        };

        // --- Event Listener Attachment ---
        const attachMemberEventListeners = () => {

        const attachInventoryEventListeners = () => {

            document.getElementById('log-consumption-form')?.addEventListener('submit', handleLogConsumption);
            document.querySelectorAll('#add-stock-options button').forEach(btn => btn.addEventListener('click', (e) => handleCoffeeSelection(e.currentTarget.dataset.coffee)));
            document.querySelectorAll('.delete-tx-btn').forEach(btn => btn.addEventListener('click', (e) => handleDeleteTransaction(e.currentTarget.dataset.id)));

        const attachPaymentsEventListeners = () => {

            document.getElementById('end-round-btn')?.addEventListener('click', handleEndRound);

                    handleMarkAsPaid(id, name, amount);

        const attachCommunicationsEventListeners = () => {

        const attachStatsEventListeners = () => {

        };

        // --- Data Handlers (CRUD & AI) ---
        const handleAddMember = async (e) => {
            e.preventDefault();
            const form = e.target;
            const { name, email, phone } = form.elements;
            if (!name.value || !email.value || !db) return;
            try {
                const userQuery = query(collection(db, getCollectionPath('users')), where("email", "==", email.value.toLowerCase()));
                const querySnapshot = await getDocs(userQuery);
                if (!querySnapshot.empty) {
                    alert("A member with this email already exists.");
                    return;
                }
                await addDoc(collection(db, getCollectionPath('users')), {
                    name: name.value, email: email.value.toLowerCase(), phone: phone.value,
                    totalContributed: 0, joinedDate: Timestamp.now()
                });
                form.reset();
            } catch (error) { console.error("Error adding member:", error); }
        };

        const handleDeleteMember = async (memberId) => {
            if (!isAdmin) return;
            try {
                await deleteDoc(doc(db, getCollectionPath('users'), memberId));
            } catch (error) { console.error("Error deleting member:", error); }
        };
        const handleDeleteTransaction = async (txId) => {
            if (!isAdmin) return;
            const txDocRef = doc(db, getCollectionPath('inventoryHistory'), txId);
            try {
                const txDoc = await getDoc(txDocRef);
                if (!txDoc.exists()) { console.error("Transaction not found"); return; }
                const txData = txDoc.data();
                
                const batch = writeBatch(db);
                batch.delete(txDocRef);

                if (txData.type === 'purchase') {
                    const coffeeId = txData.name.toLowerCase().replace(/\s+/g, '-');
                    const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), coffeeId);
                    batch.update(coffeeRef, { 
                        stockKg: increment(-txData.amountKg),
                        totalCostAllTime: increment(-txData.totalCost),
                        totalWeightAllTime: increment(-txData.amountKg)
                    });
                    
                    const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                    batch.update(financialsRef, { totalSpent: increment(-txData.totalCost) });
                } else if (txData.type === 'consumption') {
                    const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), txData.coffeeId);
                    batch.update(coffeeRef, { stockKg: increment(txData.amountKg) });
                }
                
                await batch.commit();
            } catch (error) { console.error("Error deleting transaction:", error); alert("Error deleting transaction."); }
        };
        
        const handleCoffeeSelection = (coffeeType) => {
            const form = document.getElementById('add-stock-form');
            form.classList.remove('hidden');
            const customImageField = document.getElementById('custom-image-url-field');
            const presetFields = document.getElementById('preset-fields');
            const customFields = document.getElementById('custom-fields');
            
            const presets = {
                tchibo_0_5kg: {
                    name: 'Tchibo 0.5Kg', brand: 'Tchibo', baseWeightKg: 0.5,
                    imageUrl: 'https://www.fr.tchibo.ch/img/gAAnEafs/900/image.jpeg'
                },
                tchibo_1kg: {
                    name: 'Tchibo 1Kg', brand: 'Tchibo', baseWeightKg: 1.0,
                    imageUrl: 'https://www.tchibo.ch/img/ggAHlfLS/900/image.jpeg'
                }
            };

            if (coffeeType === 'custom') {
                form.reset();
                customImageField.classList.remove('hidden');
                presetFields.classList.add('hidden');
                customFields.classList.remove('hidden');
                form.elements.name.readOnly = false;
                form.elements.brand.readOnly = false;
            } else {
                const preset = presets[coffeeType];
                form.elements.name.value = preset.name;
                form.elements.brand.value = preset.brand;
                form.elements.imageUrl.value = preset.imageUrl;
                form.elements.baseWeightKg.value = preset.baseWeightKg;
                customImageField.classList.add('hidden');
                presetFields.classList.remove('hidden');
                customFields.classList.add('hidden');
                form.elements.name.readOnly = true;
                form.elements.brand.readOnly = true;
            }
        };

        const handleAddStock = async (e) => {
            e.preventDefault();
            const form = e.target;
            const name = form.elements.name.value;
            const brand = form.elements.brand.value;
            const totalCost = parseFloat(form.elements.totalCost.value);
            let imageUrl = form.elements.imageUrl.value;
            let weightKg;

            if (form.elements.baseWeightKg.value) { // Preset mode
                const bagNumber = parseInt(form.elements.bagNumber.value);
                const baseWeight = parseFloat(form.elements.baseWeightKg.value);
                if (bagNumber < 1) { alert("Number of bags must be at least 1."); return; }
                weightKg = baseWeight * bagNumber;
            } else { // Custom mode
                weightKg = parseFloat(form.elements.weightKg.value);
                imageUrl = form.elements.customImageUrl.value;
            }

            if (!name || !brand || !weightKg || !totalCost) { alert("Please fill in all required fields."); return; }

            const coffeeId = name.toLowerCase().replace(/\s+/g, '-');

            const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), coffeeId);
            const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
            const historyRef = doc(collection(db, getCollectionPath('inventoryHistory')));

            try {
                const batch = writeBatch(db);
                batch.set(coffeeRef, { 
                    name, 
                    brand, 
                    stockKg: increment(weightKg), 
                    imageUrl,
                    totalCostAllTime: increment(totalCost),
                    totalWeightAllTime: increment(weightKg)
                }, { merge: true });
                batch.set(financialsRef, { totalSpent: increment(totalCost) }, { merge: true });
                batch.set(historyRef, { type: 'purchase', name, amountKg: weightKg, totalCost, date: serverTimestamp() });
                await batch.commit();
                form.reset();
                form.classList.add('hidden');
            } catch (error) { console.error("Error adding stock:", error); alert("Failed to add stock."); }
        };
        const handleLogConsumption = async (e) => {
            e.preventDefault();
            const form = e.target;
            const coffeeId = form.elements.coffeeId.value;
            const amountKg = parseFloat(form.elements.consumption.value);
            if (!db || !coffeeId || amountKg <= 0) return;

            const selectedCoffee = appState.coffeeTypes.find(c => c.id === coffeeId);
            if (!selectedCoffee || amountKg > selectedCoffee.stockKg) { alert("Cannot consume more coffee than is available!"); return; }

            const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), coffeeId);
            const historyRef = doc(collection(db, getCollectionPath('inventoryHistory')));
            
            try {
                const batch = writeBatch(db);
                batch.update(coffeeRef, { stockKg: increment(-amountKg) });
                batch.set(historyRef, { type: 'consumption', coffeeId, name: selectedCoffee.name, amountKg, date: serverTimestamp() });
                await batch.commit();
                form.reset();
            } catch (error) { console.error("Error logging consumption:", error); }
        };

        const handleStartNewRound = async (e) => {
            e.preventDefault();
            const form = e.target;
            const { name, amount } = form.elements;
            if (!name.value || !amount.value || !db) return;
            try {
                const batch = writeBatch(db);
                appState.paymentRounds.filter(r => r.isActive).forEach(oldRound => {
                    batch.update(doc(db, getCollectionPath('paymentRounds'), oldRound.id), { isActive: false });
                });
                batch.set(doc(collection(db, getCollectionPath('paymentRounds'))), {
                    name: name.value, amountPerPerson: parseFloat(amount.value),
                    startDate: Timestamp.now(), isActive: true
                });
                await batch.commit();
                form.reset();
            } catch (error) { console.error("Error starting new round:", error); }
        };
        
        const handleMarkAsPaid = async (memberId, memberName, amount) => {
            if (!db || !appState.activeRound || !amount || amount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            try {
                const batch = writeBatch(db);
                const paymentRef = doc(db, `${getCollectionPath('paymentRounds')}/${appState.activeRound.id}/payments`, memberId);
                batch.set(paymentRef, { status: 'paid', paymentDate: Timestamp.now(), memberName, amountPaid: amount });
                
                const memberRef = doc(db, getCollectionPath('users'), memberId);
                batch.update(memberRef, { totalContributed: increment(amount) });

                const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                batch.set(financialsRef, { totalCollected: increment(amount) }, { merge: true });

                await batch.commit();
            } catch (error) { console.error("Error marking as paid:", error); }
        };

        const handleEndRound = async () => {
            if (!appState.activeRound || !confirm("Are you sure you want to end this payment round?")) return;
            try {
                const roundRef = doc(db, getCollectionPath('paymentRounds'), appState.activeRound.id);
                await updateDoc(roundRef, { isActive: false });
            } catch (error) {
                console.error("Error ending round:", error);
            }
        };

        const handleResetCoffeeData = async () => {
            if (!isAdmin) return;
            if (!confirm("ARE YOU SURE?\n\nThis will delete ALL coffee types, ALL purchase and consumption history, and reset the total spent to $0. This action cannot be undone.")) {
                return;
            }
            try {
                const batch = writeBatch(db);
                const coffeeTypesQuery = query(collection(db, getCollectionPath('coffeeTypes')));
                const coffeeTypesSnapshot = await getDocs(coffeeTypesQuery);
                coffeeTypesSnapshot.forEach(doc => batch.delete(doc.ref));
                const historyQuery = query(collection(db, getCollectionPath('inventoryHistory')));
                const historySnapshot = await getDocs(historyQuery);
                historySnapshot.forEach(doc => batch.delete(doc.ref));
                const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                batch.update(financialsRef, { totalSpent: 0 });
                await batch.commit();
                alert("All coffee data has been successfully reset.");
            } catch (error) {
                console.error("Error resetting coffee data:", error);
                alert("An error occurred while resetting data. Please check the console.");
            }
        };

        const generateStats = () => {
            const monthlyExpensesCtx = document.getElementById('monthly-expenses-chart');
            if (!monthlyExpensesCtx) return;

            const monthlyExpenses = appState.inventoryHistory
                .filter(h => h.type === 'purchase' && h.date)
                .reduce((acc, h) => {
                    const month = new Date(h.date.toDate()).toLocaleString('default', { month: 'short', year: '2-digit' });
                    acc[month] = (acc[month] || 0) + h.totalCost;
                    return acc;
                }, {});

            new Chart(monthlyExpensesCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(monthlyExpenses),
                    datasets: [{
                        label: 'Total Spent',
                        data: Object.values(monthlyExpenses),
                        backgroundColor: 'rgba(251, 191, 36, 0.6)',
                        borderColor: 'rgba(251, 191, 36, 1)',
                        borderWidth: 1
                    }]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });

            const weeklyConsumption = appState.inventoryHistory
                .filter(h => h.type === 'consumption' && h.date)
                .reduce((acc, h) => {
                    const date = new Date(h.date.toDate());
                    const year = date.getFullYear();
                    const week = Math.ceil((((date - new Date(year, 0, 1)) / 86400000) + new Date(year, 0, 1).getDay() + 1) / 7);
                    const weekKey = `W${week}, ${year}`;
                    acc[weekKey] = (acc[weekKey] || 0) + h.amountKg;
                    return acc;
                }, {});

            const monthlyConsumption = appState.inventoryHistory
                .filter(h => h.type === 'consumption' && h.date)
                .reduce((acc, h) => {
                    const month = new Date(h.date.toDate()).toLocaleString('default', { month: 'long', year: 'numeric' });
                    acc[month] = (acc[month] || 0) + h.amountKg;
                    return acc;
                }, {});

            document.getElementById('weekly-consumption').innerHTML = `<table class="w-full text-left"><thead><tr class="border-b"><th class="p-2">Week</th><th class="p-2 text-right">Consumed (kg)</th></tr></thead><tbody>${Object.entries(weeklyConsumption).map(([key, value]) => `<tr><td class="p-2">${key}</td><td class="p-2 text-right">${value.toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
            document.getElementById('monthly-consumption').innerHTML = `<table class="w-full text-left"><thead><tr class="border-b"><th class="p-2">Month</th><th class="p-2 text-right">Consumed (kg)</th></tr></thead><tbody>${Object.entries(monthlyConsumption).map(([key, value]) => `<tr><td class="p-2">${key}</td><td class="p-2 text-right">${value.toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
        };
        
        // --- Initialization ---
        let listeners = [];
        const detachListeners = () => {
            listeners.forEach(unsubscribe => unsubscribe());
            listeners = [];
        };

        const setupListeners = () => {
            detachListeners();
            
            // Public listeners that run regardless of auth state
            listeners.push(onSnapshot(query(collection(db, getCollectionPath('coffeeTypes'))), s => {
                appState.coffeeTypes = s.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!currentUser) renderApp();
            }));
            listeners.push(onSnapshot(doc(db, getCollectionPath('financials'), 'summary'), s => {
                appState.financials = s.exists() ? s.data() : { totalCollected: 0, totalSpent: 0 };
                if (!currentUser) renderApp();
            }));

            // Authenticated listeners
            if (currentUser) {
                listeners.push(onSnapshot(query(collection(db, getCollectionPath('users'))), s => {
                    appState.members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (!isAdmin) {
                        appState.userProfile = appState.members.find(m => m.email === currentUser.email);
                    }
                    if(document.getElementById('app-container')) renderCurrentView();
                }));
                
                listeners.push(onSnapshot(query(collection(db, getCollectionPath('inventoryHistory'))), s => { 
                    appState.inventoryHistory = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.inventoryHistory.sort((a, b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
                    if(document.getElementById('app-container')) renderCurrentView(); 
                }));
            }

            // Admin-only listeners
            if (isAdmin) {
                listeners.push(onSnapshot(query(collection(db, getCollectionPath('paymentRounds'))), s => {
                    appState.paymentRounds = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.paymentRounds.sort((a, b) => (b.startDate?.toMillis() || 0) - (a.startDate?.toMillis() || 0));
                    const newActiveRound = appState.paymentRounds.find(r => r.isActive) || null;
                    if (newActiveRound?.id !== appState.activeRound?.id) {
                        appState.activeRound = newActiveRound;
                        setupActiveRoundListener();
                    } else {
                        appState.activeRound = newActiveRound;
                    }
                    if(document.getElementById('app-container')) renderCurrentView();
                }));
            }
        };

        let activeRoundUnsubscribe;
        const setupActiveRoundListener = () => {
            if (activeRoundUnsubscribe) activeRoundUnsubscribe();
            if (!appState.activeRound) {
                appState.activeRoundPayments = [];
                if(document.getElementById('app-container')) renderCurrentView();
                return;
            }
            const paymentsPath = `${getCollectionPath('paymentRounds')}/${appState.activeRound.id}/payments`;
            activeRoundUnsubscribe = onSnapshot(query(collection(db, paymentsPath)), s => {
                appState.activeRoundPayments = s.docs.map(d => ({ userId: d.id, ...d.data() }));
                if(document.getElementById('app-container')) renderCurrentView();
            });
        };

        const init = () => {
            try {
                if (!firebaseConfig.apiKey) {
                    appRoot.innerHTML = `<div class="text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg"><h2>Configuration Needed!</h2><p>Please edit this HTML file and fill in your Firebase project configuration.</p></div>`;
                    return;
                }
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                onAuthStateChanged(auth, user => {
                    detachListeners();
                    currentUser = user;
                    setupListeners(); 
                    renderApp();
                });

                modalCloseBtn.addEventListener('click', closeModal);

            } catch (error) {
                console.error("Critical initialization error:", error);
                appRoot.innerHTML = `<div class="text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg"><h2>Initialization Error</h2><p>${error.message}</p></div>`;
            }
        };

        // --- Start the App ---
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
