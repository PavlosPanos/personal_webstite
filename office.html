<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espresso Master - Coffee Club Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for stats -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Playfair & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        espresso: {
                            950: '#150f0c',
                            900: '#261b17',
                            800: '#3c2820',
                            700: '#5c3e32',
                            600: '#7d5645',
                            500: '#9e715d',
                            400: '#bd8f7b',
                            300: '#d9b09d',
                            200: '#ebcfc4',
                            100: '#f7eae4',
                        },
                        goldAccent: {
                            500: '#c5a880',
                            600: '#a3845c',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #150f0c;
            color: #f7eae4;
        }
        .coffee-glass {
            background: rgba(38, 27, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 168, 128, 0.15);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
          to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #150f0c; }
        ::-webkit-scrollbar-thumb { background: #3c2820; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a880; }
    </style>
</head>
<body class="font-sans antialiased">

    <div id="app-root">
        <div class="flex flex-col items-center justify-center h-screen bg-espresso-950">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-goldAccent-500 mb-4"></div>
            <div class="text-lg font-serif text-goldAccent-500">Brewing your experience...</div>
        </div>
    </div>

    <!-- Modal for general alerts & prompts -->
    <div id="modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 hidden">
        <div class="coffee-glass rounded-2xl max-w-lg w-full max-h-full overflow-y-auto border border-goldAccent-500/30 shadow-2xl">
            <div class="flex justify-between items-center p-5 border-b border-goldAccent-500/20">
                <h3 id="modal-title" class="text-xl font-serif font-bold text-goldAccent-500"></h3>
                <button id="modal-close-btn" class="text-espresso-300 hover:text-goldAccent-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 text-espresso-100"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
            query, where, writeBatch, Timestamp, getDoc, getDocs, serverTimestamp, increment
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Core Configurations ---
        const ADMIN_EMAIL = "pavlospanos@hotmail.com"; 
        const DEFAULT_PASSWORD = "ILoveCoffee"; 
        const GRAMS_PER_CUP = 10; 

        const firebaseConfig = {
          apiKey: "AIzaSyBqThTqWZxNg1nyXpDRNBSM-wPNpDEGodA",
          authDomain: "officecoffeemanager.firebaseapp.com",
          projectId: "officecoffeemanager",
          storageBucket: "officecoffeemanager.firebasestorage.app",
          messagingSenderId: "850510501748",
          appId: "1:850510501748:web:79816a904ad8c66d893e21",
          measurementId: "G-RKM8LJWP2P"
        };

        let db, auth;
        let currentUser = null;
        let isAdmin = false;
        let isMockMode = false;

        let appState = {
            members: [],
            coffeeTypes: [],
            financials: { totalCollected: 0, totalSpent: 0 },
            inventoryHistory: [],
            payments: [],
            activeTab: 'dashboard',
            userProfile: null,
            machineStats: { cupsSinceClean: 48, lastCleanedBy: 'Sarah Connor' } // machine maintenance state
        };

        const appId = firebaseConfig.projectId || 'coffee-club-default';

        const appRoot = document.getElementById('app-root');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- Mock Data Seeds ---
        const MOCK_STORAGE_KEY = `espresso_club_mock_db_${appId}`;
        const loadMockDB = () => {
            const data = localStorage.getItem(MOCK_STORAGE_KEY);
            if (data) return JSON.parse(data);

            const initialSeeds = {
                members: [
                    { id: 'm1', name: 'Pavlos Panos', email: 'pavlospanos@hotmail.com', phone: '+41 79 123 4567', totalContributed: 150.0, joinedDate: new Date() },
                    { id: 'm2', name: 'Sarah Connor', email: 'sarah.connor@office.com', phone: '+41 79 987 6543', totalContributed: 40.0, joinedDate: new Date() },
                    { id: 'm3', name: 'Alex Mercer', email: 'alex.mercer@office.com', phone: '+41 79 555 4433', totalContributed: 60.0, joinedDate: new Date() }
                ],
                coffeeTypes: [
                    { id: 'tchibo-1kg', name: 'Tchibo Exclusive 1Kg', brand: 'Tchibo', stockKg: 1.4, totalCostAllTime: 32.0, totalWeightAllTime: 2.0, imageUrl: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=compress&cs=tinysrgb&w=600' },
                    { id: 'lavazza-crema', name: 'Lavazza Caffè Crema', brand: 'Lavazza', stockKg: 0.8, totalCostAllTime: 24.5, totalWeightAllTime: 1.0, imageUrl: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=compress&cs=tinysrgb&w=600' }
                ],
                financials: { totalCollected: 250.0, totalSpent: 56.50 },
                inventoryHistory: [
                    { id: 'h1', type: 'purchase', name: 'Tchibo Exclusive 1Kg', amountKg: 1.0, totalCost: 16.0, date: new Date(Date.now() - 86400000 * 5).toISOString() },
                    { id: 'h2', type: 'purchase', name: 'Lavazza Caffè Crema', amountKg: 1.0, totalCost: 24.5, date: new Date(Date.now() - 86400000 * 3).toISOString() },
                    { id: 'h3', type: 'consumption', coffeeId: 'tchibo-1kg', name: 'Tchibo Exclusive 1Kg', amountKg: 0.6, memberId: 'm2', memberName: 'Sarah Connor', date: new Date(Date.now() - 86400000 * 2).toISOString() },
                    { id: 'h4', type: 'consumption', coffeeId: 'lavazza-crema', name: 'Lavazza Caffè Crema', amountKg: 0.2, memberId: 'm1', memberName: 'Pavlos Panos', date: new Date(Date.now() - 86400000).toISOString() }
                ],
                payments: [
                    { id: 'p1', memberId: 'm1', memberName: 'Pavlos Panos', amount: 50.0, date: new Date(Date.now() - 86400000 * 6).toISOString() },
                    { id: 'p2', memberId: 'm2', memberName: 'Sarah Connor', amount: 40.0, date: new Date(Date.now() - 86400000 * 4).toISOString() },
                    { id: 'p3', memberId: 'm3', memberName: 'Alex Mercer', amount: 60.0, date: new Date(Date.now() - 86400000 * 2).toISOString() },
                    { id: 'p4', memberId: 'm1', memberName: 'Pavlos Panos', amount: 100.0, date: new Date(Date.now() - 3600000).toISOString() }
                ],
                machineStats: { cupsSinceClean: 48, lastCleanedBy: 'Sarah Connor' }
            };
            localStorage.setItem(MOCK_STORAGE_KEY, JSON.stringify(initialSeeds));
            return initialSeeds;
        };

        const saveMockDB = (data) => {
            localStorage.setItem(MOCK_STORAGE_KEY, JSON.stringify(data));
        };

        const getCollectionPath = (name) => `artifacts/${appId}/public/data/${name}`;
        const showModal = (title, contentHTML) => {
            modalTitle.textContent = title;
            modalContent.innerHTML = contentHTML;
            modal.classList.remove('hidden');
        };
        const closeModal = () => modal.classList.add('hidden');
        const showError = (elementId, message) => {
            const errorEl = document.getElementById(elementId);
            if(errorEl) {
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }
        };

        const renderApp = () => {
            if (!currentUser) {
                renderLoginScreen();
            } else {
                isAdmin = currentUser.email === ADMIN_EMAIL;
                renderMainLayout();
            }
        };

        const renderLoginScreen = () => {
            const loadScreen = (coffeeTypes, financials) => {
                const remaining = (financials.totalCollected || 0) - (financials.totalSpent || 0);
                appRoot.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 bg-espresso-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-espresso-900 via-espresso-950 to-black">
                        ${isMockMode ? `<div class="bg-amber-600/20 border border-amber-600/40 text-amber-200 px-4 py-2 rounded-lg text-sm mb-6 max-w-md text-center"><strong>Demo Mode Active:</strong> Running local database setup.</div>` : ''}
                        
                        <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-5 gap-8">
                            <div class="lg:col-span-3 flex flex-col justify-center">
                                <h1 class="text-4xl md:text-5xl font-serif font-extrabold text-goldAccent-500 mb-4">Espresso Club</h1>
                                <p class="text-espresso-300 mb-8 max-w-md">Track coffee beans, member contributions, cleaning schedules, and leaderboards inside the office lounge.</p>
                                
                                <div class="grid grid-cols-3 gap-4 mb-8">
                                    <div class="coffee-glass p-4 rounded-xl"><p class="text-xs text-espresso-400 uppercase">Collected</p><p class="text-xl font-bold text-emerald-400">$${(financials.totalCollected || 0).toFixed(2)}</p></div>
                                    <div class="coffee-glass p-4 rounded-xl"><p class="text-xs text-espresso-400 uppercase">Spent</p><p class="text-xl font-bold text-rose-400">$${(financials.totalSpent || 0).toFixed(2)}</p></div>
                                    <div class="coffee-glass p-4 rounded-xl"><p class="text-xs text-espresso-400 uppercase">Balance</p><p class="text-xl font-bold text-goldAccent-500">$${remaining.toFixed(2)}</p></div>
                                </div>
                                
                                <h3 class="text-lg font-serif font-bold text-goldAccent-500 mb-3">On Tap Today</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${coffeeTypes.map(c => `
                                        <div class="coffee-glass p-3 rounded-xl flex items-center gap-3">
                                            <img src="${c.imageUrl}" onerror="this.src='https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=compress&cs=tinysrgb&w=100';" class="w-12 h-12 object-cover rounded-lg">
                                            <div>
                                                <h4 class="font-bold text-sm">${c.name}</h4>
                                                <p class="text-xs text-espresso-300">${c.brand} &bull; ${(c.stockKg || 0).toFixed(1)}kg left</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div class="lg:col-span-2 flex items-center">
                                <div class="w-full coffee-glass p-8 rounded-2xl shadow-xl">
                                    <h2 class="text-2xl font-serif font-bold text-goldAccent-500 mb-6 text-center">Member Access</h2>
                                    <form id="login-form" class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-semibold uppercase tracking-wider text-espresso-300 mb-1">Email Address</label>
                                            <input type="email" id="email" required class="w-full bg-espresso-950 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-3 text-espresso-100 outline-none transition-colors">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold uppercase tracking-wider text-espresso-300 mb-1">Password</label>
                                            <input type="password" id="password" required class="w-full bg-espresso-950 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-3 text-espresso-100 outline-none transition-colors">
                                        </div>
                                        <button type="submit" class="w-full bg-goldAccent-500 hover:bg-goldAccent-600 text-espresso-950 font-bold py-3 px-4 rounded-xl transition-colors mt-2 shadow-lg">Enter Lounge</button>
                                        <p id="login-error" class="text-rose-400 text-xs text-center hidden"></p>
                                        <div class="text-[10px] text-espresso-400 text-center leading-relaxed mt-4">
                                            Members: Use your office email and default password <span class="text-goldAccent-500 font-mono">'ILoveCoffee'</span>.
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('login-form').addEventListener('submit', handleLogin);
            };

            if (isMockMode) {
                const dbState = loadMockDB();
                loadScreen(dbState.coffeeTypes.filter(c => c.stockKg > 0), dbState.financials);
            } else {
                Promise.all([
                    getDocs(collection(db, getCollectionPath('coffeeTypes'))),
                    getDoc(doc(db, getCollectionPath('financials'), 'summary'))
                ]).then(([coffeeSnapshot, financialSnapshot]) => {
                    const coffeeList = coffeeSnapshot.docs.map(d => ({id: d.id, ...d.data()})).filter(c => (c.stockKg || 0) > 0);
                    const financials = financialSnapshot.exists() ? financialSnapshot.data() : { totalCollected: 0, totalSpent: 0 };
                    loadScreen(coffeeList, financials);
                }).catch(err => {
                    console.warn("Firebase unconfigured. Switching to Local Mock Database.", err);
                    isMockMode = true;
                    const dbState = loadMockDB();
                    loadScreen(dbState.coffeeTypes.filter(c => c.stockKg > 0), dbState.financials);
                });
            }
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (isMockMode) {
                const dbState = loadMockDB();
                const matched = dbState.members.find(m => m.email.toLowerCase() === email.toLowerCase());
                if (matched) {
                    currentUser = { email: matched.email, uid: matched.id };
                    setupListeners();
                    renderApp();
                } else if (email.toLowerCase() === ADMIN_EMAIL) {
                    currentUser = { email: ADMIN_EMAIL, uid: 'm1' };
                    setupListeners();
                    renderApp();
                } else {
                    showError('login-error', 'Email not registered in this club.');
                }
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if ((error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') && password === DEFAULT_PASSWORD) {
                    try {
                        const userQuery = query(collection(db, getCollectionPath('users')), where("email", "==", email.toLowerCase()));
                        const querySnapshot = await getDocs(userQuery);
                        if (querySnapshot.empty) {
                            showError('login-error', 'This email is not registered.');
                            return;
                        }
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (createError) {
                        showError('login-error', `Registration failed: ${createError.message}`);
                    }
                } else {
                     showError('login-error', 'Authentication failed.');
                }
            }
        };

        const handleLogout = () => {
            if (isMockMode) {
                currentUser = null;
                renderApp();
                return;
            }
            signOut(auth);
        };

        const renderMainLayout = () => {
            appRoot.innerHTML = `
                <div class="min-h-screen flex flex-col md:flex-row bg-espresso-950">
                    <aside class="w-full md:w-64 coffee-glass p-6 md:min-h-screen flex flex-col border-r border-goldAccent-500/10">
                        <div class="flex items-center gap-3 mb-8">
                            <div class="w-10 h-10 rounded-xl bg-goldAccent-500 flex items-center justify-center text-espresso-950 font-serif font-black text-xl">E</div>
                            <div>
                                <h1 class="text-lg font-serif font-bold text-goldAccent-500">Espresso Club</h1>
                                <p class="text-[10px] text-espresso-400 uppercase tracking-wider">${isMockMode ? 'Mock Server DB' : 'Synced Online DB'}</p>
                            </div>
                        </div>
                        
                        <nav id="nav-menu" class="space-y-1 flex-grow"></nav>
                        
                        <div class="mt-6 border-t border-goldAccent-500/15 pt-6">
                            <div class="text-xs text-espresso-300 truncate mb-3">
                                <p class="font-bold text-goldAccent-500 truncate">${currentUser.email}</p>
                                <p class="text-[10px] text-espresso-400 mt-0.5">${isAdmin ? 'Club Admin' : 'Club Member'}</p>
                            </div>
                            <button id="logout-btn" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 font-bold py-2.5 px-4 rounded-xl border border-rose-500/20 transition-colors">Logout</button>
                        </div>
                    </aside>
                    <main id="main-content" class="flex-1 p-6 md:p-8 overflow-y-auto max-h-screen"></main>
                </div>`;
            
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            document.getElementById('nav-menu').addEventListener('click', (e) => {
                const btn = e.target.closest('.nav-button');
                if (btn) {
                    appState.activeTab = btn.dataset.tab;
                    renderCurrentView();
                }
            });
            renderCurrentView();
        };

        const renderCurrentView = () => {
            const mainContent = document.getElementById('main-content');
            const navMenu = document.getElementById('nav-menu');
            if (!mainContent || !navMenu) return;

            const tabs = isAdmin 
                ? ['dashboard', 'members', 'stats', 'inventory', 'payments_log']
                : ['dashboard', 'members', 'stats', 'my_payments'];

            const tabIcons = {
                dashboard: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>',
                members: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
                stats: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>',
                inventory: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>',
                payments_log: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="12" y1="4" x2="12" y2="20"></line></svg>',
                my_payments: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="12" y1="4" x2="12" y2="20"></line></svg>'
            };

            navMenu.innerHTML = tabs.map(tab => `
                <button data-tab="${tab}" class="nav-button flex items-center w-full text-left py-3 px-4 rounded-xl transition-all ${appState.activeTab === tab ? 'bg-goldAccent-500 text-espresso-950 font-bold shadow-lg' : 'text-espresso-200 hover:bg-espresso-800/40'}">
                    ${tabIcons[tab]}<span class="capitalize text-sm">${tab.replace('_', ' ')}</span>
                </button>
            `).join('');

            switch (appState.activeTab) {
                case 'dashboard': renderDashboardView(mainContent); break;
                case 'members': renderMembersView(mainContent); break;
                case 'stats': renderStatsView(mainContent); break;
                case 'inventory': renderInventoryView(mainContent); break;
                case 'payments_log': renderPaymentsLogView(mainContent); break;
                case 'my_payments': renderMyPaymentsView(mainContent); break;
            }
        };

        const renderDashboardView = (container) => {
            const availableCoffee = appState.coffeeTypes.filter(c => c.stockKg > 0);
            const remainingBalance = (appState.financials.totalCollected || 0) - (appState.financials.totalSpent || 0);
            
            // Generate leaderboard list
            const leaderboards = appState.members.map(m => {
                const filterCons = appState.inventoryHistory.filter(h => h.type === 'consumption' && h.memberId === m.id);
                const weight = filterCons.reduce((sum, h) => sum + (h.amountKg || 0), 0);
                return { name: m.name, cups: weight * 100 };
            }).sort((a,b) => b.cups - a.cups);

            // Determine machine cleaning warning
            const cleanLimit = 150;
            const cupsLeft = Math.max(0, cleanLimit - (appState.machineStats?.cupsSinceClean || 0));
            const needsClean = cupsLeft <= 0;

            container.innerHTML = `
                <div class="space-y-8">
                    <div class="flex justify-between items-center">
                        <h2 class="text-3xl font-serif font-bold text-goldAccent-500">Dashboard</h2>
                        ${remainingBalance < 15.0 ? `
                            <div class="bg-amber-600/30 border border-amber-600/50 text-amber-200 px-3 py-1 text-xs rounded-xl flex items-center gap-2 animate-pulse">
                                <span>⚠️ Club Balance is low!</span>
                                <button id="broadcast-btn" class="bg-amber-500 text-espresso-950 font-bold px-2 py-0.5 rounded hover:bg-amber-400">Request Cash</button>

        };

        const attachInventoryEventListeners = () => {
            document.getElementById('add-stock-form')?.addEventListener('submit', handleAddStock);
            document.getElementById('log-consumption-form')?.addEventListener('submit', handleLogConsumption);
            
            document.getElementById('preset-tchibo-1')?.addEventListener('click', () => fillPreset('Tchibo Exclusive 1Kg', 'Tchibo', 1.0, 16.0, 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=compress&cs=tinysrgb&w=600'));
            document.getElementById('preset-lavazza-1')?.addEventListener('click', () => fillPreset('Lavazza Caffè Crema', 'Lavazza', 1.0, 24.50, 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=compress&cs=tinysrgb&w=600'));
            document.getElementById('preset-custom')?.addEventListener('click', () => fillPreset('', '', '', '', ''));
        };

        const fillPreset = (name, brand, weight, cost, imgUrl) => {
            const form = document.getElementById('add-stock-form');
            form.classList.remove('hidden');
            form.elements.name.value = name;
            form.elements.brand.value = brand;
            form.elements.weightKg.value = weight;
            form.elements.totalCost.value = cost;
            form.elements.imageUrl.value = imgUrl;
        };

        const handleAddStock = async (e) => {
            e.preventDefault();
            const form = e.target;
            const name = form.elements.name.value.trim();
            const brand = form.elements.brand.value.trim();
            const weightKg = parseFloat(form.elements.weightKg.value);
            const totalCost = parseFloat(form.elements.totalCost.value);
            const imageUrl = form.elements.imageUrl.value || 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=compress&cs=tinysrgb&w=600';

            const id = name.toLowerCase().replace(/\s+/g, '-');

            if (isMockMode) {
                const dbState = loadMockDB();
                let coffee = dbState.coffeeTypes.find(c => c.id === id);
                if (coffee) {
                    coffee.stockKg += weightKg;
                    coffee.totalCostAllTime += totalCost;
                    coffee.totalWeightAllTime += weightKg;
                } else {
                    dbState.coffeeTypes.push({ id, name, brand, stockKg: weightKg, totalCostAllTime: totalCost, totalWeightAllTime: weightKg, imageUrl });
                }
                dbState.financials.totalSpent += totalCost;
                dbState.inventoryHistory.unshift({
                    id: Math.random().toString(),
                    type: 'purchase',
                    name,
                    amountKg: weightKg,
                    totalCost,
                    date: new Date().toISOString()
                });
                saveMockDB(dbState);
                triggerMockSnapshot();
                form.reset();
                form.classList.add('hidden');
                return;
            }

            try {
                const batch = writeBatch(db);
                const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), id);
                batch.set(coffeeRef, { 
                    name, brand, imageUrl,
                    stockKg: increment(weightKg), 
                    totalCostAllTime: increment(totalCost),
                    totalWeightAllTime: increment(weightKg)
                }, { merge: true });
                
                const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                batch.set(financialsRef, { totalSpent: increment(totalCost) }, { merge: true });
                
                const historyRef = doc(collection(db, getCollectionPath('inventoryHistory')));
                batch.set(historyRef, { type: 'purchase', name, amountKg: weightKg, totalCost, date: serverTimestamp() });
                
                await batch.commit();
                form.reset();
                form.classList.add('hidden');
            } catch (err) { console.error(err); }
        };

        const handleLogConsumption = async (e) => {
            e.preventDefault();
            const form = e.target;
            const coffeeId = form.elements.coffeeId.value;
            const memberId = form.elements.memberId.value;
            const amountKg = parseFloat(form.elements.consumption.value);
            
            const selectedCoffee = appState.coffeeTypes.find(c => c.id === coffeeId);
            const selectedMember = appState.members.find(m => m.id === memberId);

            if (!selectedCoffee || !selectedMember || amountKg <= 0) return;
            if (amountKg > selectedCoffee.stockKg) {
                alert("Can't consume more than in stock!");
                return;
            }

            if (isMockMode) {
                const dbState = loadMockDB();
                const coffee = dbState.coffeeTypes.find(c => c.id === coffeeId);
                coffee.stockKg = Math.max(0, coffee.stockKg - amountKg);
                dbState.machineStats.cupsSinceClean = (dbState.machineStats.cupsSinceClean || 0) + (amountKg * 100);
                
                dbState.inventoryHistory.unshift({
                    id: Math.random().toString(),
                    type: 'consumption',
                    coffeeId,
                    name: selectedCoffee.name,
                    amountKg,
                    memberId,
                    memberName: selectedMember.name,
                    date: new Date().toISOString()
                });
                saveMockDB(dbState);
                triggerMockSnapshot();
                form.reset();
                return;
            }

            try {
                const batch = writeBatch(db);
                const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), coffeeId);
                batch.update(coffeeRef, { stockKg: increment(-amountKg) });
                
                const machineRef = doc(db, getCollectionPath('machine'), 'status');
                batch.set(machineRef, { cupsSinceClean: increment(amountKg * 100) }, { merge: true });
                
                const historyRef = doc(collection(db, getCollectionPath('inventoryHistory')));
                batch.set(historyRef, {
                    type: 'consumption',
                    coffeeId,
                    name: selectedCoffee.name,
                    amountKg,
                    memberId,
                    memberName: selectedMember.name,
                    date: serverTimestamp()
                });
                await batch.commit();
                form.reset();
            } catch (err) { console.error(err); }
        };

        const renderStatsView = (container) => {
            const memberBalanceData = appState.members.map(m => {
                const memberHistory = appState.inventoryHistory.filter(h => h.type === 'consumption' && h.memberId === m.id);
                const totalWeight = memberHistory.reduce((sum, h) => sum + (h.amountKg || 0), 0);
                
                const avgCostPerKg = 20.0;
                const totalCostConsumed = totalWeight * avgCostPerKg;
                const netBalance = (m.totalContributed || 0) - totalCostConsumed;
                
                return {
                    name: m.name,
                    contributed: m.totalContributed || 0,
                    consumedWeightKg: totalWeight,
                    cups: totalWeight * 100, 
                    costConsumed: totalCostConsumed,
                    netBalance: netBalance
                };
            });

            const balanceRows = memberBalanceData.map(d => `
                <tr class="border-b border-espresso-800 text-espresso-200 text-sm hover:bg-espresso-900/10">
                    <td class="p-3 font-semibold">${d.name}</td>
                    <td class="p-3 font-mono text-emerald-400 font-bold">$${d.contributed.toFixed(2)}</td>
                    <td class="p-3 font-mono">${d.cups.toFixed(0)} cups</td>
                    <td class="p-3 font-mono text-rose-400">$${d.costConsumed.toFixed(2)}</td>
                    <td class="p-3 font-mono text-right font-bold ${d.netBalance >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                        ${d.netBalance >= 0 ? '+' : ''}$${d.netBalance.toFixed(2)}
                    </td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="space-y-8">
                    <h2 class="text-3xl font-serif font-bold text-goldAccent-500">Club Statistics</h2>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="coffee-glass p-6 rounded-2xl shadow-xl lg:col-span-2">
                            <h3 class="text-xl font-serif text-goldAccent-500 mb-4">Club Ledger</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="border-b border-espresso-800 text-xs font-semibold uppercase tracking-wider text-espresso-300">
                                            <th class="p-3">Member</th>
                                            <th class="p-3">Total Paid</th>
                                            <th class="p-3">Logged Cups</th>
                                            <th class="p-3">Est. Cost Consumed</th>
                                            <th class="p-3 text-right">Net Balance</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${balanceRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="coffee-glass p-6 rounded-2xl shadow-xl">
                            <h3 class="text-xl font-serif text-goldAccent-500 mb-4">Monthly Spending</h3>
                            <canvas id="monthly-expenses-chart"></canvas>
                        </div>
                        
                        <div class="coffee-glass p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                            <div>
                                <h3 class="text-xl font-serif text-goldAccent-500 mb-4">Weekly Consumption Speed</h3>
                                <div id="weekly-consumption" class="text-sm space-y-2"></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            
            generateStatsCharts();
        };

        const generateStatsCharts = () => {
            const chartCanvas = document.getElementById('monthly-expenses-chart');
            if (!chartCanvas) return;

            const monthlyExpenses = appState.inventoryHistory
                .filter(h => h.type === 'purchase' && h.date)
                .reduce((acc, h) => {
                    const dateObj = new Date(isMockMode ? h.date : h.date.toDate());
                    const label = dateObj.toLocaleString('default', { month: 'short', year: '2-digit' });
                    acc[label] = (acc[label] || 0) + (h.totalCost || 0);
                    return acc;
                }, {});

            new Chart(chartCanvas, {
                type: 'bar',
                data: {
                    labels: Object.keys(monthlyExpenses),
                    datasets: [{
                        label: 'Spending ($)',
                        data: Object.values(monthlyExpenses),
                        backgroundColor: 'rgba(197, 168, 128, 0.6)',
                        borderColor: '#c5a880',
                        borderWidth: 1.5,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { 
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#bd8f7b' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#bd8f7b' }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            const weeklyConsumption = appState.inventoryHistory
                .filter(h => h.type === 'consumption' && h.date)
                .reduce((acc, h) => {
                    const dateObj = new Date(isMockMode ? h.date : h.date.toDate());
                    const startYear = new Date(dateObj.getFullYear(), 0, 1);
                    const week = Math.ceil((((dateObj - startYear) / 86400000) + startYear.getDay() + 1) / 7);
                    const label = `Week ${week}, ${dateObj.getFullYear()}`;
                    acc[label] = (acc[label] || 0) + h.amountKg;
                    return acc;
                }, {});

            const speedEl = document.getElementById('weekly-consumption');
            if (speedEl) {
                speedEl.innerHTML = Object.entries(weeklyConsumption).map(([key, value]) => `
                    <div class="flex justify-between border-b border-espresso-800 pb-2">
                        <span class="text-espresso-300 font-semibold">${key}</span>
                        <span class="font-mono text-goldAccent-500 font-bold">${value.toFixed(2)} kg (~${(value*100).toFixed(0)} cups)</span>
                    </div>
                `).join('') || '<p class="text-espresso-400">No consumption metrics.</p>';
            }
        };

        const renderPaymentsLogView = (container) => {
            const rowHTML = appState.payments.map(p => `
                <tr class="border-b border-espresso-800 hover:bg-espresso-900/10 text-sm text-espresso-200">
                    <td class="p-3 text-xs text-espresso-400">${new Date(isMockMode ? p.date : p.date.toDate()).toLocaleString()}</td>
                    <td class="p-3 font-semibold">${p.memberName}</td>
                    <td class="p-3 text-right font-mono font-bold text-emerald-400">$${p.amount.toFixed(2)}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="space-y-8">
                    <h2 class="text-3xl font-serif font-bold text-goldAccent-500">Payments Ledger</h2>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 coffee-glass p-6 rounded-2xl shadow-xl">
                            <h3 class="text-xl font-serif text-goldAccent-500 mb-4">Receipts</h3>
                            <div class="overflow-x-auto max-h-[350px]">
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="border-b border-espresso-800 text-xs font-semibold uppercase tracking-wider text-espresso-300">
                                            <th class="p-3">Date</th>
                                            <th class="p-3">Member</th>
                                            <th class="p-3 text-right">Cash</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowHTML}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <div class="coffee-glass p-6 rounded-2xl shadow-xl">
                            <h3 class="text-xl font-serif text-goldAccent-500 mb-4">Log Member Payment</h3>
                            <form id="add-payment-form" class="space-y-4">
                                <div>
                                    <label class="block text-xs uppercase tracking-wider text-espresso-300 mb-1">Select Member</label>
                                    <select name="memberId" class="w-full bg-espresso-950 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-2 text-espresso-100 outline-none text-sm transition-colors">
                                        ${appState.members.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs uppercase tracking-wider text-espresso-300 mb-1">Amount Paid ($)</label>
                                    <input name="amount" type="number" step="0.01" required placeholder="e.g. 20.00" class="w-full bg-espresso-950 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-2 text-espresso-100 outline-none text-sm transition-colors">
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-espresso-950 font-bold py-2.5 px-4 rounded-xl transition-colors text-sm shadow-md mt-2">Log Contribution</button>
                            </form>
                        </div>
                    </div>
                </div>`;
            
            document.getElementById('add-payment-form')?.addEventListener('submit', handleAddPayment);
        };

        const handleAddPayment = async (e) => {
            e.preventDefault();
            const form = e.target;
            const memberId = form.elements.memberId.value;
            const amount = parseFloat(form.elements.amount.value);
            
            const member = appState.members.find(m => m.id === memberId);
            if (!member || amount <= 0) return;

            if (isMockMode) {
                const dbState = loadMockDB();
                const m = dbState.members.find(u => u.id === memberId);
                m.totalContributed += amount;
                dbState.financials.totalCollected += amount;
                
                dbState.payments.unshift({
                    id: Math.random().toString(),
                    memberId,
                    memberName: member.name,
                    amount,
                    date: new Date().toISOString()
                });
                
                saveMockDB(dbState);
                triggerMockSnapshot();
                form.reset();
                return;
            }

            try {
                const batch = writeBatch(db);
                const paymentRef = doc(collection(db, getCollectionPath('payments')));
                batch.set(paymentRef, { memberId: member.id, memberName: member.name, amount, date: serverTimestamp() });
                
                const memberRef = doc(db, getCollectionPath('users'), memberId);
                batch.update(memberRef, { totalContributed: increment(amount) });
                
                const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                batch.set(financialsRef, { totalCollected: increment(amount) }, { merge: true });

                await batch.commit();
                form.reset();
            } catch (err) { console.error(err); }
        };

        const renderMyPaymentsView = (container) => {
            const profile = appState.members.find(m => m.email === currentUser.email) || { id: 'mock-id' };
            const myPaymentsList = appState.payments.filter(p => p.memberId === profile.id);
            const myConsumptions = appState.inventoryHistory.filter(h => h.type === 'consumption' && h.memberId === profile.id);

            const paymentRows = myPaymentsList.map(p => `
                <tr class="border-b border-espresso-800 text-espresso-200 text-sm">
                    <td class="p-3 text-xs text-espresso-400">${new Date(isMockMode ? p.date : p.date.toDate()).toLocaleString()}</td>
                    <td class="p-3 text-right font-mono font-bold text-emerald-400">+$${p.amount.toFixed(2)}</td>
                </tr>
            `).join('');

            const consumptionRows = myConsumptions.map(h => `
                <tr class="border-b border-espresso-800 text-espresso-200 text-sm">
                    <td class="p-3 text-xs text-espresso-400">${new Date(isMockMode ? h.date : h.date.toDate()).toLocaleString()}</td>
                    <td class="p-3">${h.name}</td>
                    <td class="p-3 text-right font-mono font-bold text-rose-400">-${(h.amountKg * 1000).toFixed(0)}g</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="space-y-8">
                    <h2 class="text-3xl font-serif font-bold text-goldAccent-500">My Statement</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="coffee-glass p-6 rounded-2xl shadow-xl">
                            <h3 class="text-xl font-serif text-goldAccent-500 mb-4">My Contributions</h3>
                            <div class="overflow-x-auto max-h-[300px]">
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="border-b border-espresso-800 text-xs font-semibold uppercase tracking-wider text-espresso-300">
                                            <th class="p-3">Date</th>
                                            <th class="p-3 text-right">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${paymentRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="coffee-glass p-6 rounded-2xl shadow-xl">
                            <h3 class="text-xl font-serif text-goldAccent-500 mb-4">My Coffee Consumption</h3>
                            <div class="overflow-x-auto max-h-[300px]">
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="border-b border-espresso-800 text-xs font-semibold uppercase tracking-wider text-espresso-300">
                                            <th class="p-3">Date</th>
                                            <th class="p-3">Brand</th>
                                            <th class="p-3 text-right">Deducted</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${consumptionRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>`;
        };

        let dbListeners = [];
        const detachListeners = () => {
            dbListeners.forEach(unsubscribe => unsubscribe());
            dbListeners = [];
        };

        const triggerMockSnapshot = () => {
            if (!isMockMode) return;
            const dbState = loadMockDB();
            appState.coffeeTypes = dbState.coffeeTypes;
            appState.financials = dbState.financials;
            appState.members = dbState.members;
            appState.inventoryHistory = dbState.inventoryHistory;
            appState.payments = dbState.payments;
            appState.machineStats = dbState.machineStats || { cupsSinceClean: 0, lastCleanedBy: 'None' };
            
            if (currentUser) {
                appState.userProfile = appState.members.find(m => m.email.toLowerCase() === currentUser.email.toLowerCase());
            }
            if (document.getElementById('app-container')) {
                renderCurrentView();
            }
        };

        const setupListeners = () => {
            detachListeners();

            if (isMockMode) {
                triggerMockSnapshot();
                return;
            }

            dbListeners.push(onSnapshot(query(collection(db, getCollectionPath('coffeeTypes'))), snap => {
                appState.coffeeTypes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!currentUser) renderApp();
            }, err => {
                isMockMode = true;
                setupListeners();
            }));

            dbListeners.push(onSnapshot(doc(db, getCollectionPath('financials'), 'summary'), doc => {
                appState.financials = doc.exists() ? doc.data() : { totalCollected: 0, totalSpent: 0 };
                if (!currentUser) renderApp();
            }));

            if (currentUser) {
                dbListeners.push(onSnapshot(query(collection(db, getCollectionPath('users'))), snap => {
                    appState.members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (!isAdmin) {
                        appState.userProfile = appState.members.find(m => m.email === currentUser.email);
                    }
                    if(document.getElementById('app-container')) renderCurrentView();
                }));

                dbListeners.push(onSnapshot(query(collection(db, getCollectionPath('inventoryHistory'))), snap => {
                    appState.inventoryHistory = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.inventoryHistory.sort((a,b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
                    if(document.getElementById('app-container')) renderCurrentView();
                }));

                dbListeners.push(onSnapshot(doc(db, getCollectionPath('machine'), 'status'), doc => {
                    appState.machineStats = doc.exists() ? doc.data() : { cupsSinceClean: 0, lastCleanedBy: 'None' };
                    if(document.getElementById('app-container')) renderCurrentView();
                }));

                const pQuery = isAdmin 
                    ? query(collection(db, getCollectionPath('payments')))
                    : query(collection(db, getCollectionPath('payments')), where("memberId", "==", currentUser.uid));
                
                dbListeners.push(onSnapshot(pQuery, snap => {
                    appState.payments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.payments.sort((a,b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
                    if(document.getElementById('app-container')) renderCurrentView();
                }));
            }
        };

        const init = () => {
            try {
                if (!firebaseConfig.apiKey) {
                    isMockMode = true;
                    setupListeners();
                    renderApp();
                    return;
                }
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                onAuthStateChanged(auth, user => {
                    detachListeners();
                    currentUser = user;
                    setupListeners(); 
                    renderApp();
                });
                modalCloseBtn.addEventListener('click', closeModal);
            } catch (error) {
                isMockMode = true;
                setupListeners();
                renderApp();
            }
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
