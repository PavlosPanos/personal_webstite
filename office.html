<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Espresso Master — office coffee club manager. Track beans, contributions, cleaning schedules, and leaderboards.">
    <meta name="theme-color" content="#150f0c">
    <title>Espresso Master - Coffee Club Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for stats -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Playfair & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        espresso: {
                            950: '#150f0c',
                            900: '#261b17',
                            800: '#3c2820',
                            700: '#5c3e32',
                            600: '#7d5645',
                            500: '#9e715d',
                            400: '#bd8f7b',
                            300: '#d9b09d',
                            200: '#ebcfc4',
                            100: '#f7eae4',
                        },
                        goldAccent: {
                            500: '#c5a880',
                            600: '#a3845c',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #150f0c;
            color: #f7eae4;
        }
        .coffee-glass {
            background: rgba(38, 27, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(197, 168, 128, 0.15);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
          to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #150f0c; }
        ::-webkit-scrollbar-thumb { background: #3c2820; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a880; }

        /* Premium iPhone 16 Pro Mobile Specific Styles */
        @media (max-width: 767px) {
            aside {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 60px;
                flex-direction: row !important;
                justify-content: space-between;
                align-items: center;
                padding: 0 1rem !important;
                z-index: 100;
                border-bottom: 1px solid rgba(197, 168, 128, 0.15);
                border-right: none !important;
                background: rgba(21, 15, 12, 0.95);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
            aside .flex-grow {
                display: none !important;
            }
            #mobile-bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 65px;
                background: rgba(38, 27, 23, 0.95);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-top: 1px solid rgba(197, 168, 128, 0.15);
                display: flex;
                justify-content: space-around;
                align-items: center;
                z-index: 100;
                padding: 0.25rem 0;
            }
            .mobile-nav-button {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: #ebcfc4;
                opacity: 0.7;
                font-size: 8px;
                transition: all 0.2s;
            }
            .mobile-nav-button.active {
                color: #c5a880;
                opacity: 1;
                font-weight: bold;
            }
            .mobile-nav-button svg {
                width: 18px;
                height: 18px;
                margin-bottom: 2px;
                margin-right: 0 !important;
            }
            main {
                margin-top: 60px;
                margin-bottom: 65px;
                padding: 1rem !important;
                max-height: calc(100vh - 125px) !important;
                max-height: calc(100dvh - 125px) !important; /* iOS Safari dynamic toolbar */
            }
            #mobile-bottom-nav {
                padding-bottom: calc(0.25rem + env(safe-area-inset-bottom)); /* iPhone home bar */
                height: calc(65px + env(safe-area-inset-bottom));
            }
            aside div.mt-6 {
                display: none !important;
            }
        }
        @media (min-width: 768px) {
            #mobile-bottom-nav {
                display: none !important;
            }
        }
    </style>
</head>
<body class="font-sans antialiased">

    <div id="app-root">
        <div class="flex flex-col items-center justify-center h-screen bg-espresso-950">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-goldAccent-500 mb-4"></div>
            <div class="text-lg font-serif text-goldAccent-500">Brewing your experience...</div>
        </div>
    </div>

    <!-- Modal for general alerts & prompts -->
    <div id="modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 hidden">
        <div class="coffee-glass rounded-2xl max-w-lg w-full max-h-full overflow-y-auto border border-goldAccent-500/30 shadow-2xl">
            <div class="flex justify-between items-center p-5 border-b border-goldAccent-500/20">
                <h3 id="modal-title" class="text-xl font-serif font-bold text-goldAccent-500"></h3>
                <button id="modal-close-btn" class="text-espresso-300 hover:text-goldAccent-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 text-espresso-100"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
            query, where, writeBatch, Timestamp, getDoc, getDocs, serverTimestamp, increment
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Core Configurations ---
        const ADMIN_EMAIL = "pavlospanos@hotmail.com"; 
        const DEFAULT_PASSWORD = "ILoveCoffee"; 

        const firebaseConfig = {
          apiKey: "AIzaSyBqThTqWZxNg1nyXpDRNBSM-wPNpDEGodA",
          authDomain: "officecoffeemanager.firebaseapp.com",
          projectId: "officecoffeemanager",
          storageBucket: "officecoffeemanager.firebasestorage.app",
          messagingSenderId: "850510501748",
          appId: "1:850510501748:web:79816a904ad8c66d893e21",
          measurementId: "G-RKM8LJWP2P"
        };

        let db, auth;
        let currentUser = null;
        let isAdmin = false;
        let isMockMode = false;

        let appState = {
            members: [],
            coffeeTypes: [],
            financials: { totalCollected: 0, totalSpent: 0 },
            inventoryHistory: [],
            payments: [],
            requests: [],
            broadcast: { message: '', active: false },
            activeTab: 'dashboard',
            userProfile: null,
            machineStats: { cupsSinceClean: 48, lastCleanedBy: 'Sarah Connor' },
            waterIntake: {} // Local storage for daily hydration tracker
        };

        const appId = firebaseConfig.projectId || 'coffee-club-default';

        const appRoot = document.getElementById('app-root');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- Mock Data Seeds ---
        const MOCK_STORAGE_KEY = `espresso_club_mock_db_${appId}`;
        const loadMockDB = () => {
            const data = localStorage.getItem(MOCK_STORAGE_KEY);
            if (data) return JSON.parse(data);

            const initialSeeds = {
                members: [
                    { id: 'm1', name: 'Pavlos Panos', email: 'pavlospanos@hotmail.com', phone: '+41 79 123 4567', totalContributed: 150.0, joinedDate: new Date().toISOString(), preference: { favoriteCoffee: 'lavazza-crema', roastLevel: 'medium', favoriteDrink: 'Double Espresso', dailyGoal: 3 } },
                    { id: 'm2', name: 'Sarah Connor', email: 'sarah.connor@office.com', phone: '+41 79 987 6543', totalContributed: 40.0, joinedDate: new Date().toISOString(), preference: { favoriteCoffee: 'tchibo-1kg', roastLevel: 'dark', favoriteDrink: 'Cappuccino/Latte', dailyGoal: 2 } },
                    { id: 'm3', name: 'Alex Mercer', email: 'alex.mercer@office.com', phone: '+41 79 555 4433', totalContributed: 60.0, joinedDate: new Date().toISOString(), preference: { favoriteCoffee: 'tchibo-1kg', roastLevel: 'medium', favoriteDrink: 'Single Espresso', dailyGoal: 4 } }
                ],
                coffeeTypes: [
                    { id: 'tchibo-1kg', name: 'Tchibo Exclusive 1Kg', brand: 'Tchibo', stockKg: 1.4, totalCostAllTime: 32.0, totalWeightAllTime: 2.0, imageUrl: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=compress&cs=tinysrgb&w=600', ratings: [{ stars: 5, comment: 'Strong kick, perfect crema!', reviewer: 'Sarah Connor' }] },
                    { id: 'lavazza-crema', name: 'Lavazza Caffè Crema', brand: 'Lavazza', stockKg: 0.8, totalCostAllTime: 24.5, totalWeightAllTime: 1.0, imageUrl: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=compress&cs=tinysrgb&w=600', ratings: [{ stars: 4, comment: 'Mild taste, great for afternoon!', reviewer: 'Pavlos Panos' }] }
                ],
                financials: { totalCollected: 250.0, totalSpent: 56.50 },
                inventoryHistory: [
                    { id: 'h1', type: 'purchase', name: 'Tchibo Exclusive 1Kg', amountKg: 1.0, totalCost: 16.0, date: new Date(Date.now() - 86400000 * 5).toISOString() },
                    { id: 'h2', type: 'purchase', name: 'Lavazza Caffè Crema', amountKg: 1.0, totalCost: 24.5, date: new Date(Date.now() - 86400000 * 3).toISOString() },
                    { id: 'h3', type: 'consumption', coffeeId: 'tchibo-1kg', name: 'Tchibo Exclusive 1Kg', amountKg: 0.014, memberId: 'm2', memberName: 'Sarah Connor', date: new Date(Date.now() - 86400000 * 2).toISOString(), drinkType: 'Cappuccino/Latte' },
                    { id: 'h4', type: 'consumption', coffeeId: 'lavazza-crema', name: 'Lavazza Caffè Crema', amountKg: 0.018, memberId: 'm1', memberName: 'Pavlos Panos', date: new Date(Date.now() - 86400000).toISOString(), drinkType: 'Double Espresso' }
                ],
                payments: [
                    { id: 'p1', memberId: 'm1', memberName: 'Pavlos Panos', amount: 50.0, date: new Date(Date.now() - 86400000 * 6).toISOString(), status: 'approved' },
                    { id: 'p2', memberId: 'm2', memberName: 'Sarah Connor', amount: 40.0, date: new Date(Date.now() - 86400000 * 4).toISOString(), status: 'approved' },
                    { id: 'p3', memberId: 'm3', memberName: 'Alex Mercer', amount: 60.0, date: new Date(Date.now() - 86400000 * 2).toISOString(), status: 'approved' },
                    { id: 'p4', memberId: 'm1', memberName: 'Pavlos Panos', amount: 100.0, date: new Date(Date.now() - 3600000).toISOString(), status: 'approved' }
                ],
                requests: [
                    { id: 'r1', brand: 'Kimbo', name: 'Kimbo Extra Intense Roast', requestedBy: 'Sarah Connor', votes: ['m2', 'm3'], status: 'pending' }
                ],
                broadcast: { message: 'We need new cleaning tablets soon. Please handle with care!', active: true },
                machineStats: { cupsSinceClean: 48, lastCleanedBy: 'Sarah Connor' }
            };
            localStorage.setItem(MOCK_STORAGE_KEY, JSON.stringify(initialSeeds));
            return initialSeeds;
        };

        const saveMockDB = (data) => {
            localStorage.setItem(MOCK_STORAGE_KEY, JSON.stringify(data));
        };

        const getCollectionPath = (name) => `artifacts/${appId}/public/data/${name}`;
        const showModal = (title, contentHTML) => {
            modalTitle.textContent = title;
            modalContent.innerHTML = contentHTML;
            modal.classList.remove('hidden');
        };
        const closeModal = () => modal.classList.add('hidden');

        const renderApp = () => {
            if (!currentUser) {
                renderLoginScreen();
            } else {
                isAdmin = currentUser.email === ADMIN_EMAIL;
                renderMainLayout();
            }
        };

        const renderLoginScreen = () => {
            const loadScreen = (coffeeTypes, financials) => {
                const remaining = (financials.totalCollected || 0) - (financials.totalSpent || 0);
                appRoot.innerHTML = `
                    <div class="min-h-screen flex flex-col justify-center items-center p-4 bg-espresso-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-espresso-900 via-espresso-950 to-black">
                        ${isMockMode ? `<div class="bg-amber-600/20 border border-amber-600/40 text-amber-200 px-4 py-2 rounded-lg text-sm mb-6 max-w-md text-center"><strong>Demo Mode Active:</strong> Running local database setup.<br><span class="text-xs opacity-80">Sign in with e.g. <strong>pavlospanos@hotmail.com</strong> (any password)</span></div>` : ''}
                        
                        <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-5 gap-8">
                            <div class="lg:col-span-3 flex flex-col justify-center">
                                <h1 class="text-4xl md:text-5xl font-serif font-extrabold text-goldAccent-500 mb-4">Espresso Club</h1>
                                <p class="text-espresso-300 mb-8 max-w-md">Track coffee beans, member contributions, cleaning schedules, and leaderboards inside the office lounge.</p>
                                
                                <div class="grid grid-cols-3 gap-4 mb-8">
                                    <div class="coffee-glass p-4 rounded-xl"><p class="text-xs text-espresso-400 uppercase">Collected</p><p class="text-xl font-bold text-emerald-400">$${(financials.totalCollected || 0).toFixed(2)}</p></div>
                                    <div class="coffee-glass p-4 rounded-xl"><p class="text-xs text-espresso-400 uppercase">Spent</p><p class="text-xl font-bold text-rose-400">$${(financials.totalSpent || 0).toFixed(2)}</p></div>
                                    <div class="coffee-glass p-4 rounded-xl"><p class="text-xs text-espresso-400 uppercase">Balance</p><p class="text-xl font-bold text-goldAccent-500">$${remaining.toFixed(2)}</p></div>
                                </div>
                            </div>
                            
                            <div class="lg:col-span-2 w-full">
                                <div class="coffee-glass p-8 rounded-2xl border border-goldAccent-500/10 shadow-2xl">
                                    <h3 class="text-2xl font-serif font-bold text-goldAccent-500 mb-6">Welcome Back</h3>
                                    
                                    <div id="login-error" class="hidden bg-rose-500/15 border border-rose-500/30 text-rose-300 px-4 py-2.5 rounded-xl text-xs mb-4"></div>
                                    
                                    <form id="login-form" class="space-y-4">
                                        <div>
                                            <label class="block text-xs uppercase tracking-wider text-espresso-300 mb-1">Email</label>
                                            <input type="email" id="login-email" required class="w-full bg-espresso-950/60 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-3 text-espresso-100 outline-none text-sm transition-colors">
                                        </div>
                                        <div>
                                            <label class="block text-xs uppercase tracking-wider text-espresso-300 mb-1">Password</label>
                                            <input type="password" id="login-password" required class="w-full bg-espresso-950/60 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-3 text-espresso-100 outline-none text-sm transition-colors">
                                        </div>
                                        <button type="submit" class="w-full bg-goldAccent-500 hover:bg-goldAccent-600 text-espresso-950 font-bold py-3.5 px-4 rounded-xl transition-all font-semibold shadow-lg text-sm mt-6">Login to Club</button>
                                    </form>
                                    
                                    <div class="mt-6 text-center text-xs text-espresso-400">
                                        <p>Use your registered corporate email</p>
                                        <p class="mt-1">Default Password: <span class="font-bold text-espresso-300">${DEFAULT_PASSWORD}</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('login-form').addEventListener('submit', handleLogin);
            };

            if (isMockMode) {
                const dbState = loadMockDB();
                loadScreen(dbState.coffeeTypes, dbState.financials);
            } else {
                loadScreen(appState.coffeeTypes, appState.financials);
            }
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            if (isMockMode) {
                const dbState = loadMockDB();
                const matched = dbState.members.find(m => m.email.toLowerCase() === email.toLowerCase());
                if (matched) {
                    currentUser = { email: matched.email, uid: matched.id };
                    setupListeners();
                    renderApp();
                } else {
                    errorEl.textContent = "User not registered in Espresso Club.";
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            try {
                const credential = await signInWithEmailAndPassword(auth, email, password);
                currentUser = credential.user;
                renderApp();
            } catch (err) {
                console.error(err);
                errorEl.textContent = err.message || "Invalid Credentials.";
                errorEl.classList.remove('hidden');
            }
        };

        const handleLogout = () => {
            currentUser = null;
            isAdmin = false;
            if (isMockMode) {
                renderApp();
                return;
            }
            signOut(auth);
        };

        const renderMainLayout = () => {
            appRoot.innerHTML = `
                <div class="min-h-screen flex flex-col md:flex-row bg-espresso-950">
                    <aside class="w-full md:w-64 coffee-glass p-6 md:min-h-screen flex flex-col border-r border-goldAccent-500/10">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-goldAccent-500 flex items-center justify-center text-espresso-950 font-serif font-black text-xl">E</div>
                            <div>
                                <h1 class="text-lg font-serif font-bold text-goldAccent-500">Espresso Club</h1>
                                <p class="text-[10px] text-espresso-400 uppercase tracking-wider">${isMockMode ? 'Mock Server DB' : 'Synced Online DB'}</p>
                            </div>
                        </div>
                        
                        <nav id="nav-menu" class="space-y-1 flex-grow"></nav>
                        
                        <div class="mt-6 border-t border-goldAccent-500/15 pt-6">

                                <p class="font-bold text-goldAccent-500 truncate">${currentUser.email}</p>

                    </aside>

                </div>`;
            
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            document.getElementById('nav-menu').addEventListener('click', (e) => {
                const btn = e.target.closest('.nav-button');
                if (btn) {
                    appState.activeTab = btn.dataset.tab;
                    renderCurrentView();
                }
            });

            document.getElementById('mobile-bottom-nav').addEventListener('click', (e) => {
                const btn = e.target.closest('.mobile-nav-button');
                if (btn) {
                    appState.activeTab = btn.dataset.tab;
                    renderCurrentView();
                }
            });

            renderCurrentView();
        };

            const mainContent = document.getElementById('main-content');
            const navMenu = document.getElementById('nav-menu');
            const mobileBottomNav = document.getElementById('mobile-bottom-nav');
            if (!mainContent || !navMenu) return;

            const tabs = isAdmin 
                ? ['dashboard', 'members', 'requests', 'stats', 'inventory', 'payments_log']
                : ['dashboard', 'members', 'requests', 'stats', 'preferences', 'my_payments'];

            const tabIcons = {
                dashboard: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>',
                members: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
                requests: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>',

            container.querySelectorAll('.custom-brew-btn').forEach(btn => {

        const handleCustomBrew = async (coffeeId, type, weight) => {
            const selectedCoffee = appState.coffeeTypes.find(c => c.id === coffeeId);
            if (!selectedCoffee || selectedCoffee.stockKg < weight) {
                alert("This coffee is out of stock or does not have enough weight!");
                return;
            }
            const activeMember = appState.members.find(m => m.email === currentUser.email) || { id: 'm1', name: 'Pavlos Panos' };

                const dbState = loadMockDB();
                const coffee = dbState.coffeeTypes.find(c => c.id === coffeeId);
                coffee.stockKg = Math.max(0, coffee.stockKg - weight);
                dbState.machineStats.cupsSinceClean = (dbState.machineStats.cupsSinceClean || 0) + 1;
                
                dbState.inventoryHistory.unshift({
                    id: Math.random().toString(),
                    type: 'consumption',
                    coffeeId: coffee.id,

                    amountKg: weight,
                    drinkType: type,
                    memberId: activeMember.id,
                    memberName: activeMember.name,
                    date: new Date().toISOString()
                });
                
                saveMockDB(dbState);
                triggerMockSnapshot();
                alert(`Enjoy your freshly brewed ${type}! ☕`);
                return;
            }

            try {
                const batch = writeBatch(db);
                const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), coffeeId);
                batch.update(coffeeRef, { stockKg: increment(-weight) });
                
                const machineRef = doc(db, getCollectionPath('machine'), 'status');
                batch.set(machineRef, { cupsSinceClean: increment(1) }, { merge: true });
                
                const historyRef = doc(collection(db, getCollectionPath('inventoryHistory')));
                batch.set(historyRef, {
                    type: 'consumption',
                    coffeeId,
                    name: selectedCoffee.name,
                    amountKg: weight,
                    drinkType: type,
                    memberId: activeMember.id,
                    memberName: activeMember.name,
                    date: serverTimestamp()
                });
                await batch.commit();
                alert(`Enjoy your freshly brewed ${type}! ☕`);
            } catch (err) {
                console.error(err);
                alert("Failed to log cup.");
            }
        };

        const handleDescaleMachine = async () => {
            const activeMember = appState.members.find(m => m.email === currentUser.email) || { id: 'm1', name: 'Pavlos Panos' };
            if (isMockMode) {
                const dbState = loadMockDB();
                dbState.machineStats = { cupsSinceClean: 0, lastCleanedBy: activeMember.name };
                dbState.inventoryHistory.unshift({
                    id: Math.random().toString(),
                    type: 'maintenance',
                    name: 'Machine Descaled',
                    amountKg: 0,
                    memberId: activeMember.id,
                    memberName: activeMember.name,
                    date: new Date().toISOString()
                });
                saveMockDB(dbState);
                triggerMockSnapshot();
                alert("Machine descaling logged! Counter reset to 0.");
                return;
            }

            try {

            const totalCost = parseFloat(form.elements.totalCost.value);

            const id = name.toLowerCase().replace(/\s+/g, '-');

            if (isMockMode) {
                const dbState = loadMockDB();
                let coffee = dbState.coffeeTypes.find(c => c.id === id);
                if (coffee) {
                    coffee.stockKg += weightKg;
                    coffee.totalCostAllTime += totalCost;
                    coffee.totalWeightAllTime += weightKg;
                } else {
                    dbState.coffeeTypes.push({ id, name, brand, stockKg: weightKg, totalCostAllTime: totalCost, totalWeightAllTime: weightKg, imageUrl, ratings: [] });
                }
                dbState.financials.totalSpent += totalCost;
                dbState.inventoryHistory.unshift({
                    id: Math.random().toString(),
                    type: 'purchase',
                    name,
                    amountKg: weightKg,
                    totalCost,
                    date: new Date().toISOString()

                    dbState.requests = dbState.requests.filter(r => r.name.toLowerCase() !== name.toLowerCase());

                triggerMockSnapshot();
                form.reset();

                return;

                const coffeeRef = doc(db, getCollectionPath('coffeeTypes'), id);

                    name, brand, imageUrl,
                    stockKg: increment(weightKg), 
                    totalCostAllTime: increment(totalCost),
                    totalWeightAllTime: increment(weightKg)
                }, { merge: true });
                
                const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                batch.set(financialsRef, { totalSpent: increment(totalCost) }, { merge: true });
                
                const historyRef = doc(collection(db, getCollectionPath('inventoryHistory')));
                batch.set(historyRef, { type: 'purchase', name, amountKg: weightKg, totalCost, date: serverTimestamp() });

                alert("Can't consume more than in stock!");
                return;

            if (isMockMode) {
                const dbState = loadMockDB();

                coffee.stockKg = Math.max(0, coffee.stockKg - amountKg);
                dbState.machineStats.cupsSinceClean = (dbState.machineStats.cupsSinceClean || 0) + (amountKg * 100);

                batch.set(paymentRef, { memberId: member.id, memberName: member.name, amount, date: serverTimestamp(), status: 'approved' });
                
                const memberRef = doc(db, getCollectionPath('users'), memberId);
                batch.update(memberRef, { totalContributed: increment(amount) });
                
                const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                batch.set(financialsRef, { totalCollected: increment(amount) }, { merge: true });

                await batch.commit();
                form.reset();
            } catch (err) { console.error(err); }
        };

        const renderMyPaymentsView = (container) => {
            const profile = appState.members.find(m => m.email === currentUser.email) || { id: 'mock-id' };
            const myPaymentsList = appState.payments.filter(p => p.memberId === profile.id);
            const myConsumptions = appState.inventoryHistory.filter(h => h.type === 'consumption' && h.memberId === profile.id);

            const paymentRows = myPaymentsList.map(p => `
                <tr class="border-b border-espresso-800 text-espresso-200 text-sm">
                    <td class="p-3 text-xs text-espresso-400">${new Date(isMockMode ? p.date : p.date.toDate()).toLocaleString()}</td>
                    <td class="p-3 font-semibold text-center">
                        ${p.status === 'pending' 
                            ? `<span class="bg-amber-600/20 border border-amber-500/30 text-amber-300 px-2 py-0.5 rounded text-[10px]">Pending</span>` 
                            : `<span class="bg-emerald-600/20 border border-emerald-500/30 text-emerald-300 px-2 py-0.5 rounded text-[10px]">Verified</span>`}
                    </td>
                    <td class="p-3 text-right font-mono font-bold text-emerald-400">+$${p.amount.toFixed(2)}</td>
                </tr>
            `).join('');

            const consumptionRows = myConsumptions.map(h => `
                <tr class="border-b border-espresso-800 text-espresso-200 text-sm">
                    <td class="p-3 text-xs text-espresso-400">${new Date(isMockMode ? h.date : h.date.toDate()).toLocaleString()}</td>
                    <td class="p-3">${h.drinkType ? `${h.name} (${h.drinkType})` : h.name}</td>
                    <td class="p-3 text-right font-mono font-bold text-rose-400">-${(h.amountKg * 1000).toFixed(0)}g</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="space-y-8">
                    <h2 class="text-3xl font-serif font-bold text-goldAccent-500">My Statement</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-6">
                            <!-- Contributions List -->
                            <div class="coffee-glass p-6 rounded-2xl shadow-xl overflow-x-auto">
                                <h3 class="text-xl font-serif text-goldAccent-500 mb-4">My Contributions</h3>
                                <table class="w-full text-left min-w-[300px]">
                                    <thead>
                                        <tr class="border-b border-espresso-800 text-xs font-semibold uppercase tracking-wider text-espresso-300">
                                            <th class="p-3">Date</th>
                                            <th class="p-3 text-center">Status</th>
                                            <th class="p-3 text-right">Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${paymentRows || '<tr><td colspan="3" class="p-4 text-center text-espresso-400 text-sm">No cash contributions logged.</td></tr>'}
                                    </tbody>
                                </table>
                            </div>

                            <!-- Settle Balance Form -->
                            <div class="coffee-glass p-6 rounded-2xl shadow-xl">
                                <h3 class="text-xl font-serif text-goldAccent-500 mb-4">Submit Payment Verification</h3>
                                <form id="settle-balance-form" class="space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs uppercase tracking-wider text-espresso-300 mb-1">Amount ($)</label>
                                            <input name="amount" type="number" step="0.01" required placeholder="e.g. 20.00" class="w-full bg-espresso-950 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-2 text-espresso-100 outline-none text-sm transition-colors">
                                        </div>
                                        <div>
                                            <label class="block text-xs uppercase tracking-wider text-espresso-300 mb-1">Reference Info</label>
                                            <input name="reference" type="text" required placeholder="e.g. Revolut transaction ID" class="w-full bg-espresso-950 border border-espresso-800 focus:border-goldAccent-500 rounded-xl px-4 py-2 text-espresso-100 outline-none text-sm transition-colors">
                                        </div>
                                    </div>
                                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-espresso-950 font-bold py-2 px-4 rounded-xl transition-all shadow-md">Submit Contribution Claim</button>
                                </form>
                            </div>
                        </div>

                        <div class="coffee-glass p-6 rounded-2xl shadow-xl overflow-x-auto">
                            <h3 class="text-xl font-serif text-goldAccent-500 mb-4">My Coffee Consumption</h3>
                            <table class="w-full text-left min-w-[300px]">
                                <thead>
                                    <tr class="border-b border-espresso-800 text-xs font-semibold uppercase tracking-wider text-espresso-300">
                                        <th class="p-3">Date</th>
                                        <th class="p-3">Brand</th>
                                        <th class="p-3 text-right">Deducted</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${consumptionRows || '<tr><td colspan="3" class="p-4 text-center text-espresso-400 text-sm">No coffee cups logged yet. Grab a brew!</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            
            document.getElementById('settle-balance-form')?.addEventListener('submit', handleSettleBalanceSubmit);
        };

        const handleSettleBalanceSubmit = async (e) => {
            e.preventDefault();
            const amount = parseFloat(e.target.elements.amount.value);
            const reference = e.target.elements.reference.value.trim();
            const activeMember = appState.members.find(m => m.email === currentUser.email) || { id: 'm1', name: 'Pavlos Panos' };

            if (isMockMode) {
                const dbState = loadMockDB();
                dbState.payments.unshift({
                    id: 'pay_' + Math.random().toString(36).substr(2, 9),
                    memberId: activeMember.id,
                    memberName: activeMember.name,
                    amount,
                    date: new Date().toISOString(),
                    reference,
                    status: 'pending'
                });
                saveMockDB(dbState);
                triggerMockSnapshot();
                e.target.reset();
                alert("Payment claim submitted! Pending admin verification.");
                return;
            }

            try {
                await addDoc(collection(db, getCollectionPath('payments')), {
                    memberId: activeMember.id, memberName: activeMember.name, amount, reference, status: 'pending', date: serverTimestamp()
                });
                e.target.reset();
                alert("Payment claim submitted! Pending admin verification.");
            } catch(e) { console.error(e); }
        };

        window.approvePayment = async (id) => {
            if (isMockMode) {
                const dbState = loadMockDB();
                const payment = dbState.payments.find(p => p.id === id);
                if (payment) {
                    payment.status = 'approved';
                    const member = dbState.members.find(m => m.id === payment.memberId);
                    if (member) member.totalContributed += payment.amount;
                    dbState.financials.totalCollected += payment.amount;
                    
                    saveMockDB(dbState);
                    triggerMockSnapshot();
                    alert("Payment contribution verified and approved!");
                }
                return;
            }

            try {
                const docRef = doc(db, getCollectionPath('payments'), id);
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const payment = snap.data();
                    const batch = writeBatch(db);
                    batch.update(docRef, { status: 'approved' });
                    
                    const memberRef = doc(db, getCollectionPath('users'), payment.memberId);
                    batch.update(memberRef, { totalContributed: increment(payment.amount) });
                    
                    const financialsRef = doc(db, getCollectionPath('financials'), 'summary');
                    batch.set(financialsRef, { totalCollected: increment(payment.amount) }, { merge: true });
                    
                    await batch.commit();
                    alert("Payment contribution verified and approved!");
                }
            } catch(e) { console.error(e); }
        };

        window.rejectPayment = async (id) => {
            if (!confirm("Reject this payment claim?")) return;
            if (isMockMode) {
                const dbState = loadMockDB();
                dbState.payments = dbState.payments.filter(p => p.id !== id);
                saveMockDB(dbState);
                triggerMockSnapshot();
                return;
            }
            try {
                await deleteDoc(doc(db, getCollectionPath('payments'), id));
            } catch(e) { console.error(e); }
        };

        let dbListeners = [];
        const detachListeners = () => {
            dbListeners.forEach(unsubscribe => unsubscribe());
            dbListeners = [];
        };

        const triggerMockSnapshot = () => {
            if (!isMockMode) return;
            const dbState = loadMockDB();
            appState.coffeeTypes = dbState.coffeeTypes || [];
            appState.financials = dbState.financials || { totalCollected: 0, totalSpent: 0 };
            appState.members = dbState.members || [];
            appState.inventoryHistory = dbState.inventoryHistory || [];
            appState.payments = dbState.payments || [];
            appState.requests = dbState.requests || [];
            appState.broadcast = dbState.broadcast || { message: '', active: false };
            appState.machineStats = dbState.machineStats || { cupsSinceClean: 0, lastCleanedBy: 'None' };
            
            if (currentUser) {
                appState.userProfile = appState.members.find(m => m.email.toLowerCase() === currentUser.email.toLowerCase());
            }
            if (document.getElementById('main-content')) {
                renderCurrentView();
            }
        };

        const setupListeners = () => {
            detachListeners();

            if (isMockMode) {
                triggerMockSnapshot();
                return;
            }

            dbListeners.push(onSnapshot(query(collection(db, getCollectionPath('coffeeTypes'))), snap => {
                appState.coffeeTypes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!currentUser) renderApp();
            }, err => {
                isMockMode = true;
                setupListeners();
            }));

            dbListeners.push(onSnapshot(doc(db, getCollectionPath('financials'), 'summary'), doc => {
                appState.financials = doc.exists() ? doc.data() : { totalCollected: 0, totalSpent: 0 };
                if (!currentUser) renderApp();
            }));

            if (currentUser) {
                dbListeners.push(onSnapshot(query(collection(db, getCollectionPath('users'))), snap => {
                    appState.members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (!isAdmin) {
                        appState.userProfile = appState.members.find(m => m.email === currentUser.email);
                    }
                    if(document.getElementById('main-content')) renderCurrentView();
                }));

                dbListeners.push(onSnapshot(query(collection(db, getCollectionPath('inventoryHistory'))), snap => {
                    appState.inventoryHistory = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.inventoryHistory.sort((a,b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
                    if(document.getElementById('main-content')) renderCurrentView();
                }));

                dbListeners.push(onSnapshot(doc(db, getCollectionPath('machine'), 'status'), doc => {
                    appState.machineStats = doc.exists() ? doc.data() : { cupsSinceClean: 0, lastCleanedBy: 'None' };
                    if(document.getElementById('main-content')) renderCurrentView();
                }));

                dbListeners.push(onSnapshot(query(collection(db, getCollectionPath('requests'))), snap => {
                    appState.requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.requests.sort((a,b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
                    if(document.getElementById('main-content')) renderCurrentView();
                }));

                dbListeners.push(onSnapshot(doc(db, getCollectionPath('broadcast'), 'active'), doc => {
                    appState.broadcast = doc.exists() ? doc.data() : { message: '', active: false };
                    if(document.getElementById('main-content')) renderCurrentView();
                }));

                const pQuery = isAdmin 
                    ? query(collection(db, getCollectionPath('payments')))
                    : query(collection(db, getCollectionPath('payments')), where("memberId", "==", currentUser.uid));
                
                dbListeners.push(onSnapshot(pQuery, snap => {
                    appState.payments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appState.payments.sort((a,b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
                    if(document.getElementById('main-content')) renderCurrentView();
                }));
            }
        };

        const init = () => {
            try {
                if (!firebaseConfig.apiKey) {
                    isMockMode = true;
                    setupListeners();
                    renderApp();
                    return;
                }
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                onAuthStateChanged(auth, user => {
                    detachListeners();
                    currentUser = user;
                    setupListeners(); 
                    renderApp();
                });
                modalCloseBtn.addEventListener('click', closeModal);
            } catch (error) {
                isMockMode = true;
                setupListeners();
                renderApp();
            }
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
