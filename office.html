<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Club Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Simple scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .prose { max-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="app-container" class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="bg-gray-800 text-white w-full md:w-64 p-4 md:min-h-screen">
            <div class="flex items-center mb-8">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 mr-3 text-amber-400"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg>
                <h1 class="text-xl font-bold">Coffee Master</h1>
            </div>
            <nav id="nav-menu" class="flex flex-row md:flex-col justify-around md:justify-start">
                <!-- Nav buttons will be injected here by JS -->
            </nav>
            <div id="app-info" class="mt-auto pt-8 text-xs text-gray-400 hidden md:block">
                <!-- App and User ID will be injected here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8">
            <div class="flex items-center justify-center h-full">
                <div class="text-xl font-semibold">Loading Coffee Club Manager...</div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-full overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 id="modal-title" class="text-xl font-semibold"></h3>
                <button id="modal-close-btn" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 prose"></div>
        </div>
    </div>

    <script type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
            query, writeBatch, Timestamp, getDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- IMPORTANT: Firebase Configuration ---
        // 1. Create a Firebase project at https://console.firebase.google.com/
        // 2. Go to Project Settings -> General -> Your apps -> Web app.
        // 3. Copy the firebaseConfig object and paste it here.
        const firebaseConfig = {
            // apiKey: "...",
            // authDomain: "...",
            // projectId: "...",
            // storageBucket: "...",
            // messagingSenderId: "...",
            // appId: "..."
        };

        // --- App State ---
        let db, auth, userId;
        let members = [];
        let inventory = { officeStockKg: 0, warehouseStockKg: 0 };
        let consumptionLog = [];
        let paymentRounds = [];
        let activeRound = null;
        let activeRoundPayments = [];
        let activeTab = 'dashboard';
        
        const appId = firebaseConfig.projectId || 'coffee-club-default';

        // --- DOM Elements ---
        const mainContent = document.getElementById('main-content');
        const navMenu = document.getElementById('nav-menu');
        const appInfo = document.getElementById('app-info');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // --- Helper Functions ---
        const getCollectionPath = (collectionName) => `artifacts/${appId}/public/data/${collectionName}`;
        
        const showModal = (title, contentHTML) => {
            modalTitle.textContent = title;
            modalContent.innerHTML = contentHTML;
            modal.classList.remove('hidden');
        };
        
        const closeModal = () => {
            modal.classList.add('hidden');
        };

        // --- Render Functions ---
        const renderNav = () => {
            const tabs = [
                { id: 'dashboard', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>` },
                { id: 'members', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>` },
                { id: 'inventory', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>` },
                { id: 'payments', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>` },
                { id: 'communications', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-3"><path d="m22 2-7 20-4-9-9-4Z"/><path d="m22 2-11 11"/></svg>` }
            ];
            navMenu.innerHTML = tabs.map(tab => `
                <button data-tab="${tab.id}" class="nav-button flex items-center w-full text-left p-3 my-1 rounded-lg transition-colors duration-200 ${activeTab === tab.id ? 'bg-amber-500 text-gray-900' : 'hover:bg-gray-700'}">
                    ${tab.icon}
                    <span class="capitalize hidden md:inline">${tab.id}</span>
                </button>
            `).join('');
        };

        const renderContent = () => {
            renderNav();
            switch (activeTab) {
                case 'dashboard': renderDashboard(); break;
                case 'members': renderMembers(); break;
                case 'inventory': renderInventory(); break;
                case 'payments': renderPayments(); break;
                case 'communications': renderCommunications(); break;
                default: renderDashboard();
            }
        };

        const renderDashboard = () => {
            const totalStock = (inventory.officeStockKg || 0) + (inventory.warehouseStockKg || 0);
            const lastMonthConsumption = consumptionLog
                .filter(log => log.date.toMillis() > Date.now() - 30 * 24 * 60 * 60 * 1000)
                .reduce((sum, log) => sum + log.amountConsumedKg, 0);

            mainContent.innerHTML = `
                <h2 class="text-3xl font-bold mb-6">Dashboard</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow-md flex items-center">
                        <div class="p-3 rounded-full bg-amber-100 text-amber-600 mr-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </div>
                        <div><p class="text-sm text-gray-500">Total Members</p><p class="text-2xl font-bold">${members.length}</p></div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md flex items-center">
                        <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                        </div>
                        <div><p class="text-sm text-gray-500">Total Coffee Stock</p><p class="text-2xl font-bold">${totalStock.toFixed(2)} kg</p></div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md flex items-center">
                        <div class="p-3 rounded-full bg-green-100 text-green-600 mr-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg>
                        </div>
                        <div><p class="text-sm text-gray-500">Last 30 Days Consumption</p><p class="text-2xl font-bold">${lastMonthConsumption.toFixed(2)} kg</p></div>
                    </div>
                </div>
                <div class="mt-8 bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-xl font-semibold mb-4">Active Payment Round</h3>
                    ${activeRound ? `
                        <div>
                            <p><strong>Round Name:</strong> ${activeRound.name}</p>
                            <p><strong>Amount:</strong> $${activeRound.amountPerPerson.toFixed(2)} per person</p>
                            <p><strong>Start Date:</strong> ${new Date(activeRound.startDate.toDate()).toLocaleDateString()}</p>
                        </div>
                    ` : `
                        <p class="text-gray-500">No active payment round. Start one from the Payments tab!</p>
                    `}
                </div>
            `;
        };

        const renderMembers = () => {
            mainContent.innerHTML = `
                <h2 class="text-3xl font-bold mb-6">Manage Members</h2>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                        <h3 class="text-xl font-semibold mb-4">Current Members (${members.length})</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead><tr class="border-b"><th class="p-2">Name</th><th class="p-2">Email</th><th class="p-2 hidden md:table-cell">Phone</th><th class="p-2 text-right">Total Contributed</th><th class="p-2 text-center">Actions</th></tr></thead>
                                <tbody>
                                    ${members.map(member => `
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="p-2 font-medium">${member.name}</td>
                                            <td class="p-2 text-gray-600">${member.email}</td>
                                            <td class="p-2 text-gray-600 hidden md:table-cell">${member.phone}</td>
                                            <td class="p-2 text-right font-semibold">$${(member.totalContributed || 0).toFixed(2)}</td>
                                            <td class="p-2 text-center">
                                                <button data-id="${member.id}" class="delete-member-btn text-red-500 hover:text-red-700 p-1">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h3 class="text-xl font-semibold mb-4">Add New Member</h3>
                        <form id="add-member-form" class="space-y-4">
                            <input name="name" type="text" placeholder="Full Name" required class="w-full p-2 border rounded-md" />
                            <input name="email" type="email" placeholder="Email Address" required class="w-full p-2 border rounded-md" />
                            <input name="phone" type="tel" placeholder="Phone Number (Optional)" class="w-full p-2 border rounded-md" />
                            <button type="submit" class="w-full bg-amber-500 text-white font-bold py-2 px-4 rounded-md hover:bg-amber-600 transition-colors">Add Member</button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('add-member-form').addEventListener('submit', handleAddMember);
            document.querySelectorAll('.delete-member-btn').forEach(btn => btn.addEventListener('click', (e) => handleDeleteMember(e.currentTarget.dataset.id)));
        };

        const renderInventory = () => {
            mainContent.innerHTML = `
                <h2 class="text-3xl font-bold mb-6">Inventory Management</h2>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h3 class="text-xl font-semibold mb-4">Update Stock Levels</h3>
                            <form id="update-inventory-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Office Stock (kg)</label>
                                    <input name="office" type="number" step="0.1" value="${inventory.officeStockKg}" class="w-full p-2 border rounded-md mt-1" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Warehouse Stock (kg)</label>
                                    <input name="warehouse" type="number" step="0.1" value="${inventory.warehouseStockKg}" class="w-full p-2 border rounded-md mt-1" />
                                </div>
                                <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">Update Stock</button>
                            </form>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md">
                            <h3 class="text-xl font-semibold mb-4">Log Consumption</h3>
                            <form id="log-consumption-form" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Amount Consumed (kg)</label>
                                    <input name="consumption" type="number" step="0.1" placeholder="e.g., 0.5" required class="w-full p-2 border rounded-md mt-1" />
                                </div>
                                <button type="submit" class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded-md hover:bg-green-600 transition-colors">Log Consumption</button>
                            </form>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h3 class="text-xl font-semibold mb-4">Consumption History</h3>
                        <ul class="space-y-3 max-h-96 overflow-y-auto">
                            ${consumptionLog.map(log => `
                                <li class="flex justify-between items-center text-sm border-b pb-2">
                                    <span>${new Date(log.date.toDate()).toLocaleDateString()}</span>
                                    <span class="font-semibold">${log.amountConsumedKg.toFixed(2)} kg</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
            document.getElementById('update-inventory-form').addEventListener('submit', handleUpdateInventory);
            document.getElementById('log-consumption-form').addEventListener('submit', handleLogConsumption);
        };

        const renderPayments = () => {
             const paidMemberIds = new Set(activeRoundPayments.filter(p => p.status === 'paid').map(p => p.userId));
             const unpaidMembers = members.filter(m => !paidMemberIds.has(m.id));
             const paidMembers = members.filter(m => paidMemberIds.has(m.id));

            mainContent.innerHTML = `
                <h2 class="text-3xl font-bold mb-6">Payment Rounds</h2>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                        <h3 class="text-xl font-semibold mb-4">Active Round: ${activeRound ? activeRound.name : 'None'}</h3>
                        ${activeRound ? `
                            <div>
                                <p class="mb-4">Mark members as paid for <strong>$${activeRound.amountPerPerson.toFixed(2)}</strong></p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <h4 class="font-bold mb-2">Unpaid (${unpaidMembers.length})</h4>
                                        <ul class="space-y-2 max-h-80 overflow-y-auto pr-2">
                                            ${unpaidMembers.map(member => `
                                                <li class="flex justify-between items-center bg-red-50 p-2 rounded-md">
                                                    <span>${member.name}</span>
                                                    <button data-id="${member.id}" data-name="${member.name}" data-total="${member.totalContributed || 0}" class="mark-paid-btn bg-green-500 text-white text-xs font-bold py-1 px-2 rounded hover:bg-green-600">Mark Paid</button>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                    <div>
                                        <h4 class="font-bold mb-2">Paid (${paidMembers.length})</h4>
                                        <ul class="space-y-2 max-h-80 overflow-y-auto pr-2">
                                            ${paidMembers.map(member => `
                                                <li class="flex justify-between items-center bg-green-50 p-2 rounded-md text-gray-500">
                                                    <span>${member.name}</span>
                                                    <span>Paid</span>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        ` : `<p class="text-gray-500">Start a new round to begin collecting payments.</p>`}
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h3 class="text-xl font-semibold mb-4">Manage Rounds</h3>
                        <form id="start-round-form" class="space-y-4 mb-6">
                            <h4 class="font-bold">Start a New Round</h4>
                            <input name="name" type="text" placeholder="Round Name (e.g., August 2025)" required class="w-full p-2 border rounded-md" />
                            <input name="amount" type="number" step="0.01" placeholder="Amount per person" required class="w-full p-2 border rounded-md" />
                            <button type="submit" class="w-full bg-amber-500 text-white font-bold py-2 px-4 rounded-md hover:bg-amber-600 transition-colors">Start New Round</button>
                        </form>
                        <h4 class="font-bold mt-6 mb-2">Past Rounds</h4>
                        <ul class="space-y-2 max-h-48 overflow-y-auto">
                            ${paymentRounds.filter(r => !r.isActive).map(round => `
                                <li class="text-sm p-2 bg-gray-100 rounded-md">${round.name} - $${round.amountPerPerson.toFixed(2)}</li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
            document.getElementById('start-round-form').addEventListener('submit', handleStartNewRound);
            document.querySelectorAll('.mark-paid-btn').forEach(btn => btn.addEventListener('click', (e) => {
                const { id, name, total } = e.currentTarget.dataset;
                handleMarkAsPaid(id, name, parseFloat(total));
            }));
        };

        const renderCommunications = () => {
            mainContent.innerHTML = `
                <h2 class="text-3xl font-bold mb-6">Communications</h2>
                <p class="mb-8 text-gray-600">This section allows you to generate and preview emails. In a real-world deployment, these buttons could be connected to an email service to send them automatically. For now, you can copy the content and send it manually.</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-lg shadow-md flex flex-col items-center text-center">
                        <h3 class="text-xl font-semibold mb-2">Monthly Newsletter</h3>
                        <p class="text-gray-500 mb-4 flex-grow">Send an update to all members about current stock levels and recent consumption.</p>
                        <button id="send-newsletter-btn" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">Generate Newsletter</button>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md flex flex-col items-center text-center">
                        <h3 class="text-xl font-semibold mb-2">Payment Reminder</h3>
                        <p class="text-gray-500 mb-4 flex-grow">Notify members that a new payment round has begun.</p>
                        <button id="send-reminder-btn" ${!activeRound ? 'disabled' : ''} class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded-md hover:bg-green-600 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
                            ${activeRound ? 'Generate Reminder' : 'No Active Round'}
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('send-newsletter-btn').addEventListener('click', handleSendNewsletter);
            document.getElementById('send-reminder-btn').addEventListener('click', handleSendPaymentReminder);
        };

        // --- Event Handlers ---
        const handleAddMember = async (e) => {
            e.preventDefault();
            const form = e.target;
            const { name, email, phone } = form.elements;
            if (!name.value || !email.value || !db) return;
            try {
                await addDoc(collection(db, getCollectionPath('users')), {
                    name: name.value, email: email.value, phone: phone.value,
                    totalContributed: 0, joinedDate: Timestamp.now()
                });
                form.reset();
            } catch (error) { console.error("Error adding member:", error); }
        };

        const handleDeleteMember = async (memberId) => {
            if (!db || !confirm(`Are you sure you want to remove this member? This cannot be undone.`)) return;
            try {
                await deleteDoc(doc(db, getCollectionPath('users'), memberId));
            } catch (error) { console.error("Error deleting member:", error); }
        };

        const handleUpdateInventory = async (e) => {
            e.preventDefault();
            const { office, warehouse } = e.target.elements;
            if (!db) return;
            const docRef = doc(db, getCollectionPath('inventory'), 'main');
            try {
                await updateDoc(docRef, {
                    officeStockKg: parseFloat(office.value),
                    warehouseStockKg: parseFloat(warehouse.value),
                    lastUpdated: Timestamp.now()
                });
            } catch (error) { console.error("Error updating inventory:", error); }
        };

        const handleLogConsumption = async (e) => {
            e.preventDefault();
            const form = e.target;
            const amountKg = parseFloat(form.elements.consumption.value);
            if (!db || amountKg <= 0) return;
            const newOfficeStock = Math.max(0, inventory.officeStockKg - amountKg);
            try {
                const batch = writeBatch(db);
                const logRef = doc(collection(db, getCollectionPath('consumptionLog')));
                batch.set(logRef, { amountConsumedKg: amountKg, date: Timestamp.now() });
                const inventoryRef = doc(db, getCollectionPath('inventory'), 'main');
                batch.update(inventoryRef, { officeStockKg: newOfficeStock, lastUpdated: Timestamp.now() });
                await batch.commit();
                form.reset();
            } catch (error) { console.error("Error logging consumption:", error); }
        };

        const handleStartNewRound = async (e) => {
            e.preventDefault();
            const form = e.target;
            const { name, amount } = form.elements;
            if (!name.value || !amount.value || !db) return;
            try {
                const batch = writeBatch(db);
                paymentRounds.filter(r => r.isActive).forEach(oldRound => {
                    const roundRef = doc(db, getCollectionPath('paymentRounds'), oldRound.id);
                    batch.update(roundRef, { isActive: false });
                });
                const newRoundRef = doc(collection(db, getCollectionPath('paymentRounds')));
                batch.set(newRoundRef, {
                    name: name.value, amountPerPerson: parseFloat(amount.value),
                    startDate: Timestamp.now(), isActive: true
                });
                await batch.commit();
                form.reset();
            } catch (error) { console.error("Error starting new round:", error); }
        };

        const handleMarkAsPaid = async (memberId, memberName, memberTotalContributed) => {
            if (!db || !activeRound) return;
            try {
                const batch = writeBatch(db);
                const paymentRef = doc(db, `${getCollectionPath('paymentRounds')}/${activeRound.id}/payments`, memberId);
                batch.set(paymentRef, { status: 'paid', paymentDate: Timestamp.now(), memberName });
                const memberRef = doc(db, getCollectionPath('users'), memberId);
                const newTotal = (memberTotalContributed || 0) + activeRound.amountPerPerson;
                batch.update(memberRef, { totalContributed: newTotal });
                await batch.commit();
                
                const emailContent = `
                    <p>Hi ${memberName},</p>
                    <p>This is a confirmation that we've received your payment of <strong>$${activeRound.amountPerPerson.toFixed(2)}</strong> for the coffee round: "${activeRound.name}".</p>
                    <p>Your total contribution to the coffee club is now <strong>$${newTotal.toFixed(2)}</strong>.</p>
                    <p>Thanks for keeping us caffeinated!</p><p>Best,<br>The Coffee Master</p>`;
                showModal(`Payment Confirmation for ${memberName}`, emailContent);
            } catch (error) { console.error("Error marking as paid:", error); }
        };

        const handleSendNewsletter = () => {
            const totalStock = inventory.officeStockKg + inventory.warehouseStockKg;
            const recentConsumption = consumptionLog.slice(0, 4).reduce((acc, log) => acc + log.amountConsumedKg, 0);
            const emailContent = `<h2>Coffee Club Monthly Update!</h2><p>Hi team,</p><p>Here's your monthly update:</p><ul><li><strong>Office Stock:</strong> ${inventory.officeStockKg.toFixed(2)} kg</li><li><strong>Warehouse Stock:</strong> ${inventory.warehouseStockKg.toFixed(2)} kg</li><li><strong>Total Available:</strong> ${totalStock.toFixed(2)} kg</li></ul><p>Over the last month (or last 4 entries), we've consumed approximately <strong>${recentConsumption.toFixed(2)} kg</strong> of coffee.</p><p>Best,<br>The Coffee Master</p>`;
            showModal("Monthly Newsletter Preview", emailContent);
        };

        const handleSendPaymentReminder = () => {
            if (!activeRound) { alert("No active payment round."); return; }
            const paidMemberIds = new Set(activeRoundPayments.filter(p => p.status === 'paid').map(p => p.userId));
            const unpaidMembers = members.filter(m => !paidMemberIds.has(m.id));
            const emailContent = `<h2>Coffee Club Payment Reminder</h2><p>Hi everyone,</p><p>This is a friendly reminder for the coffee payment round, "<strong>${activeRound.name}</strong>". The contribution is <strong>$${activeRound.amountPerPerson.toFixed(2)}</strong>.</p><p>This reminder would be sent to:</p><ul>${unpaidMembers.map(m => `<li>${m.name} (${m.email})</li>`).join('')}</ul><p>Thanks,<br>The Coffee Master</p>`;
            showModal("Payment Reminder Preview", emailContent);
        };

        // --- Initialization ---
        const init = () => {
            // Check if firebaseConfig is filled
            if (!firebaseConfig.apiKey) {
                mainContent.innerHTML = `<div class="text-center p-8 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                    <h2 class="text-2xl font-bold mb-4">Configuration Needed!</h2>
                    <p>Please edit this HTML file and fill in your Firebase project configuration in the <code>firebaseConfig</code> object in the script tag.</p>
                </div>`;
                return;
            }

            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            onAuthStateChanged(auth, user => {
                if (user) {
                    userId = user.uid;
                    appInfo.innerHTML = `<p>App ID: <span class="font-mono">${appId}</span></p><p class="mt-2">User ID: <span class="font-mono break-all">${userId}</span></p>`;
                    // Start listening to data changes once authenticated
                    setupListeners();
                }
            });

            signInAnonymously(auth).catch(error => console.error("Anonymous sign-in failed:", error));
            
            navMenu.addEventListener('click', (e) => {
                const button = e.target.closest('.nav-button');
                if (button) {
                    activeTab = button.dataset.tab;
                    renderContent();
                }
            });
            modalCloseBtn.addEventListener('click', closeModal);
        };

        const setupListeners = () => {
            // Members
            onSnapshot(query(collection(db, getCollectionPath('users'))), snapshot => {
                members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if(activeTab === 'dashboard' || activeTab === 'members' || activeTab === 'payments') renderContent();
            });

            // Inventory
            onSnapshot(doc(db, getCollectionPath('inventory'), 'main'), async (docSnap) => {
                if (docSnap.exists()) {
                    inventory = docSnap.data();
                } else {
                    await setDoc(doc(db, getCollectionPath('inventory'), 'main'), { officeStockKg: 0, warehouseStockKg: 0, lastUpdated: Timestamp.now() });
                }
                if(activeTab === 'dashboard' || activeTab === 'inventory') renderContent();
            });

            // Consumption Log
            onSnapshot(query(collection(db, getCollectionPath('consumptionLog'))), snapshot => {
                consumptionLog = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                consumptionLog.sort((a, b) => b.date.toMillis() - a.date.toMillis());
                if(activeTab === 'dashboard' || activeTab === 'inventory') renderContent();
            });

            // Payment Rounds
            onSnapshot(query(collection(db, getCollectionPath('paymentRounds'))), snapshot => {
                paymentRounds = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                paymentRounds.sort((a, b) => b.startDate.toMillis() - a.startDate.toMillis());
                const newActiveRound = paymentRounds.find(r => r.isActive) || null;
                
                // If active round changes, we need to fetch its payments
                if (newActiveRound?.id !== activeRound?.id) {
                    activeRound = newActiveRound;
                    setupActiveRoundListener();
                } else {
                    activeRound = newActiveRound;
                }
                if(activeTab === 'dashboard' || activeTab === 'payments') renderContent();
            });
        };

        let activeRoundUnsubscribe;
        const setupActiveRoundListener = () => {
            if (activeRoundUnsubscribe) activeRoundUnsubscribe(); // Unsubscribe from old listener
            if (!activeRound) {
                activeRoundPayments = [];
                renderContent();
                return;
            }
            const paymentsPath = `${getCollectionPath('paymentRounds')}/${activeRound.id}/payments`;
            activeRoundUnsubscribe = onSnapshot(query(collection(db, paymentsPath)), snapshot => {
                activeRoundPayments = snapshot.docs.map(doc => ({ userId: doc.id, ...doc.data() }));
                if(activeTab === 'payments' || activeTab === 'communications') renderContent();
            });
        }

        // --- Start the App ---
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
